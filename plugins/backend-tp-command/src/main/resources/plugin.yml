name: TeleportCommand
main: io.github.misdocumeno.BackendTeleportCommandPlugin
version: '0.1.0'
api-version: '1.20'
commands:
  tp:
    description: Teleport to a player
    usage: /tp <player> [otherplayer]
    permission: misplease.tp.command
  tphere:
    description: Teleport a player to you
    usage: /tphere <player>
    permission: misplease.tphere.command
  tpa:
    description: Request to teleport to the specified player
    usage: /tpa <player>
    permission: misplease.tpa.command
  tpahere:
    description: Request that the specified player teleport to you
    usage: /tpahere <player>
    permission: misplease.tpahere.command
  tpaccept:
    description: Accept a teleport request
    usage: /tpaccept [player|*]
    permission: misplease.tpaccept.command
  tpdeny:
    description: Reject teleport requests
    usage: /tpdeny [player|*]
    permission: misplease.tpdeny.command
  tpacancel:
    description: Cancel an outgoing teleport request
    usage: /tpacancel [player|*]
    permission: misplease.tpacancel.command
  tpall:
    description: Teleport all players
    usage: /tpall [player]
    permission: misplease.tpall.command
permissions:
  misplease.tpa.command:
    description: Request to teleport to a player
    default: true
  misplease.tpahere.command:
    description: Request that a player teleport to you
    default: true
  misplease.tpaccept.command:
    description: Accept a teleport request
    default: true
  misplease.tpdeny.command:
    description: Reject a teleport request
    default: true
  misplease.tpacancel.command:
    description: Cancel an outgoing teleport request
    default: true
  misplease.tp.command:
    description: Teleport to a player immediately
    default: op
  misplease.tphere.command:
    description: Teleport a player to you immediately
    default: op
  misplease.tpall.command:
    description: Teleport all players
    default: op
