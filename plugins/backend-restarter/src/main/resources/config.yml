# Each day at `at` (local timezone): declare one restart intent.
# If empty (≥ empty-seconds) → stop now. If not → stay pending until empty
# that long, whenever that is (even days later). Missed days do not stack.
# Docker `restart: unless-stopped` brings the JVM back.
enabled: true
timezone: America/Argentina/Buenos_Aires
at: "05:00"
empty-seconds: 60
warn-message: "&eReinicio diario: el servidor se apaga en unos segundos…"
