# Local / Docker Desktop: builds images here.
# Preprod + prod: use docker-compose.prod.yml (GHCR pull only).
services:
  velocity:
    image: misplease/velocity:dev
    build:
      context: .
      dockerfile: docker/server.Dockerfile
      # Local LOCK_VARIANT=local downloads inside the image; optional disk cache:
      # PLUGIN_CACHE_CONTEXT=.plugin-lock-cache
      additional_contexts:
        plugin-cache: ${PLUGIN_CACHE_CONTEXT:-docker/empty-plugin-cache}
        # CI-only contexts (ignored when LOCK_VARIANT=local); stubs keep BuildKit happy if referenced.
        lock-jars: docker/empty-plugin-cache
        lock-server: docker/empty-plugin-cache
      args:
        LOCK: infra/velocity/plugins-lock.yml
        PLUGIN_PREFIX: velocity-
    container_name: misplease-proxy
    init: true
    stop_grace_period: 30s
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    devices:
      - /dev/fuse
    environment:
      - KIND=proxy
      - JVM_OPTS=-Xms256M -Xmx512M
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - DB_PASSWORD=${DB_PASSWORD}
      - DATABASE_URL=postgres://misplease:${DB_PASSWORD}@db:5432/misplease
    volumes:
      - ./infra/velocity/config:/config:ro
      - ./infra/velocity/data:/data
    ports:
      - 25565:25577
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  main:
    image: misplease/main:dev
    build:
      context: .
      dockerfile: docker/server.Dockerfile
      additional_contexts:
        plugin-cache: ${PLUGIN_CACHE_CONTEXT:-docker/empty-plugin-cache}
        lock-jars: docker/empty-plugin-cache
        lock-server: docker/empty-plugin-cache
      args:
        LOCK: infra/minecraft/main/plugins-lock.yml
        PLUGIN_PREFIX: backend-
    container_name: misplease-main
    init: true
    stop_grace_period: 90s
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    devices:
      - /dev/fuse
    environment:
      - KIND=server
      - SERVER_ID=main
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - DB_PASSWORD=${DB_PASSWORD}
      - DATABASE_URL=postgres://misplease:${DB_PASSWORD}@db:5432/misplease
      # Flags from live prod main (itzg) + preferSparkPlugin for baked jars.
      - JVM_OPTS=-Xms256M -Xmx3G -XX:+UseG1GC -XX:+ParallelRefProcEnabled -XX:MaxGCPauseMillis=200 -XX:+DisableExplicitGC -Dorg.maxgamer.quickshop.util.envcheck.skip.SIGNATURE_VERIFY -Dpaper.preferSparkPlugin=true --add-modules=jdk.incubator.vector
      - RCON_PASSWORD=${RCON_PASSWORD:-}
    volumes:
      - ./infra/minecraft/main/config:/config:ro
      - ./infra/minecraft/main/data:/data
    ports:
      # dynmap
      - 8080:25568
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  tech:
    image: misplease/tech:dev
    build:
      context: .
      dockerfile: docker/server.Dockerfile
      additional_contexts:
        plugin-cache: ${PLUGIN_CACHE_CONTEXT:-docker/empty-plugin-cache}
        lock-jars: docker/empty-plugin-cache
        lock-server: docker/empty-plugin-cache
      args:
        LOCK: infra/minecraft/tech/plugins-lock.yml
        PLUGIN_PREFIX: backend-
        RUNTIME_JAVA: "25"
    container_name: misplease-tech
    init: true
    stop_grace_period: 90s
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    devices:
      - /dev/fuse
    environment:
      - KIND=server
      - SERVER_ID=tech
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - DB_PASSWORD=${DB_PASSWORD}
      - DATABASE_URL=postgres://misplease:${DB_PASSWORD}@db:5432/misplease
      # Flags from live prod tech (itzg) + preferSparkPlugin for baked jars.
      - JVM_OPTS=-Xms256M -Xmx2G -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -Dpaper.preferSparkPlugin=true
      - RCON_PASSWORD=${RCON_PASSWORD:-}
    volumes:
      - ./infra/minecraft/tech/config:/config:ro
      - ./infra/minecraft/tech/data:/data
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  auth:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    image: misplease/auth:dev
    container_name: misplease-auth
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgres://misplease:${DB_PASSWORD}@db:5432/misplease
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - AUTH_ADMIN_TOKEN=${AUTH_ADMIN_TOKEN:-}
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    ports:
      - 127.0.0.1:3000:3000

  # Drizzle migrator from @misplease/db (baked into auth image).
  db-migrate:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    image: misplease/auth:dev
    container_name: misplease-db-migrate
    environment:
      - DATABASE_URL=postgres://misplease:${DB_PASSWORD}@db:5432/misplease
    depends_on:
      db:
        condition: service_healthy
    command: ["node", "/app/packages/db/dist/migrate.js"]

  db:
    image: postgres:18-alpine
    container_name: misplease-db
    restart: unless-stopped
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_USER=misplease
      - POSTGRES_DB=misplease
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'misplease']
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - 5432:5432

  redis:
    image: redis:8.10-alpine
    container_name: misplease-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly no
      --save ""
    healthcheck:
      test: redis-cli -a ${REDIS_PASSWORD} ping
      interval: 10s
      timeout: 5s
      retries: 5

  # TODO: build plugins, and gather external .jars
  # init:

volumes:
  db-data:
