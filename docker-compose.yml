services:
  velocity:
    image: itzg/mc-proxy:java21@sha256:fbbb3b24e12226857bf796a624e3093a6c731d2f36c2d94e2845ea1b694d4026
    container_name: misplease-proxy
    environment:
      - TYPE=VELOCITY
      - VELOCITY_VERSION=3.4.0-SNAPSHOT
      - OVERRIDE_CONFIG=true
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
    volumes:
      - ./infra/velocity/config:/config
      - ./infra/velocity/plugins:/plugins
    ports:
      - 25565:25577
    restart: unless-stopped

  main:
    image: itzg/minecraft-server:java21@sha256:f6d0b91029e73afd765ae8b0689cdac754067f3e36cb2d60608366f82d650008
    container_name: misplease-main
    environment:
      - SERVER_ID=main
      - TYPE=PURPUR
      - VERSION=1.20.1
      - EULA=TRUE
      - ONLINE_MODE=FALSE
      - OVERRIDE_SERVER_PROPERTIES=FALSE
      - MEMORY=4G
      - OPS=f62a41ae-4198-391b-ad68-6dbbc530da23
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - DATABASE_URL=postgres://misplease:${DB_PASSWORD}@db:5432/misplease
      - JVM_OPTS=-Xms1G -Xmx5G -XX:+UseG1GC -XX:+ParallelRefProcEnabled -XX:MaxGCPauseMillis=200 -XX:+DisableExplicitGC -Dorg.maxgamer.quickshop.util.envcheck.skip.SIGNATURE_VERIFY --add-modules=jdk.incubator.vector
      - COPY_CONFIG_DEST=/data
    volumes:
      - ./infra/minecraft/main/config:/config
      - ./infra/minecraft/main/plugins:/plugins
      - ./infra/minecraft/main/data:/data
    ports:
      # dynmap
      - 8080:25568
    restart: unless-stopped

  tech:
    image: itzg/minecraft-server:java21@sha256:f6d0b91029e73afd765ae8b0689cdac754067f3e36cb2d60608366f82d650008
    container_name: misplease-tech
    environment:
      - SERVER_ID=tech
      - TYPE=PAPER
      - VERSION=1.21.11
      - EULA=TRUE
      - ONLINE_MODE=FALSE
      - OVERRIDE_SERVER_PROPERTIES=FALSE
      - OPS=f62a41ae-4198-391b-ad68-6dbbc530da23
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - DATABASE_URL=postgres://misplease:${DB_PASSWORD}@db:5432/misplease
      - JVM_OPTS=-Xms512M -Xmx4G -XX:+UseG1GC -XX:MaxGCPauseMillis=200
      - COPY_CONFIG_DEST=/data
    volumes:
      - ./infra/minecraft/tech/config:/config
      - ./infra/minecraft/tech/plugins:/plugins
      - ./infra/minecraft/tech/data:/data
    restart: unless-stopped

  auth:
    build: ./services/auth
    image: misplease/auth:latest
    container_name: misplease-auth
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgres://misplease:${DB_PASSWORD}@db:5432/misplease
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
    depends_on:
      auth-db-migrate:
        condition: service_completed_successfully
    ports:
      - 127.0.0.1:3000:3000

  auth-db-migrate:
    build: ./services/auth
    image: misplease/auth:latest
    container_name: misplease-auth-migrate
    environment:
      - DATABASE_URL=postgres://misplease:${DB_PASSWORD}@db:5432/misplease
    volumes:
      # TODO: add drizzle directories here would be enough for multiple tables migrations?
      # or should i create multiple databases in the same container?
      - ./services/auth/drizzle:/app/drizzle
    depends_on:
      db:
        condition: service_healthy
    command: node /app/dist/migrate.js

  db:
    image: postgres:18.6-alpine
    container_name: misplease-db
    restart: unless-stopped
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_USER=misplease
      - POSTGRES_DB=misplease
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'misplease']
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - 5432:5432

  redis:
    image: redis:8.10.3-alpine
    container_name: misplease-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly no
      --save ""
    healthcheck:
      test: redis-cli -a ${REDIS_PASSWORD} ping
      interval: 10s
      timeout: 5s
      retries: 5

  # TODO: build plugins, and gather external .jars
  # init:

volumes:
  db-data:
