apiVersion: 1

datasources:
  - name: VictoriaMetrics
    uid: vm
    type: prometheus
    access: proxy
    url: http://victoriametrics:8428
    isDefault: true
    jsonData:
      httpMethod: POST
      timeInterval: 30s
      prometheusType: Prometheus

  # Tempo API is implemented by VictoriaTraces; gives TraceQL + Traces Drilldown.
  - name: VictoriaTraces
    uid: vt
    type: tempo
    access: proxy
    url: http://victoria-traces:10428/select/tempo

  - name: VictoriaLogs
    uid: vl
    type: victoriametrics-logs-datasource
    access: proxy
    url: http://victoria-logs:9428
