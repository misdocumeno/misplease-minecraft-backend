# Declarative config hot-reload for the ops deployer agent.
# If every path in applied→wanted matches a rule below → sync + RCON (no game compose).
# Anything else → full image deploy (empty gate + compose).
#
# Matching is per-rule: only rules whose `paths` hit the diff run.
# Keep one rule per server (or plugin+server) so main-only edits do not RCON tech.
#
# sync from/to are inferred from paths of the form:
#   infra/minecraft/<server>/config/plugins/<Plugin>/**
#   → from …/config/plugins/<Plugin>
#   → to   …/data/state/plugins/<Plugin>
#   → RCON host = <server>
# (velocity: infra/velocity/config/plugins/<Plugin>/** → data/state likewise)
#
# rcon: plugin.yml `name` as namespace prefix (PluginName:command).
#
# Do NOT list plugins whose tracked config contains secret placeholders
# (LuckPerms, etc.) — those are injected only at container entrypoint.

rules:
  - id: betterwarps-main
    paths:
      - infra/minecraft/main/config/plugins/BetterWarps/**
    rcon: BetterWarps:warpsreload

  - id: betterwarps-tech
    paths:
      - infra/minecraft/tech/config/plugins/BetterWarps/**
    rcon: BetterWarps:warpsreload
