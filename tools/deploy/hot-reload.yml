# Config hot-reload for the ops deployer agent.
#
# `paths` are relative to each server's `config/plugins/` tree:
#   infra/minecraft/<server>/config/plugins/
#   infra/velocity/config/plugins/
#
# For each changed file under those roots, if it matches a rule path the agent
# syncs that plugin into that server's data/state and runs `rcon` on the
# affected service (Paper built-in RCON; Velocity via Velocircon). Proxy
# restarts drop every online player, so prefer this path over compose bounce.
#
# One rule covers all servers: main-only edits only touch main; tech-only → tech;
# velocity config → velocity.
#
# rcon: plugin.yml `name` as namespace (PluginName:command).
#
# Do NOT list plugins whose tracked config contains secret placeholders
# (LuckPerms, etc.) — those are injected only at container entrypoint.

rules:
  - id: betterwarps
    paths:
      - BetterWarps/**
    rcon: BetterWarps:warpsreload
