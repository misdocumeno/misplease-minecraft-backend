# Declarative config hot-reload for the ops deployer agent.
# If every path in applied→wanted matches a rule below, the agent syncs
# files into the overlay upper (data/state) and runs RCON — no compose up.
# Anything else → full image deploy (empty gate + compose).
#
# Do NOT list plugins whose tracked config contains secret placeholders
# (LuckPerms, etc.) — those are injected only at container entrypoint.

rules:
  - id: betterwarps
    paths:
      - infra/minecraft/main/config/plugins/BetterWarps/**
      - infra/minecraft/tech/config/plugins/BetterWarps/**
    targets:
      - server: main
        sync:
          from: infra/minecraft/main/config/plugins/BetterWarps
          to: infra/minecraft/main/data/state/plugins/BetterWarps
        rcon: warpsreload
      - server: tech
        sync:
          from: infra/minecraft/tech/config/plugins/BetterWarps
          to: infra/minecraft/tech/data/state/plugins/BetterWarps
        rcon: warpsreload
