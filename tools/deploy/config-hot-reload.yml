# Config-only hot reload for the ops deployer agent.
#
# WHAT THIS DOES (and does not do)
#   It re-reads *configuration files* on a running server: the agent writes the
#   tracked files from infra/<server>/config/plugins/<Plugin>/ into the running
#   container's /srv tree and then runs the plugin's own reload command over
#   RCON.
#   It never swaps jars, never unloads/reloads a plugin, and never restarts a
#   server. A jar / plugins.yml / compose change always takes the normal deploy
#   path (wait for empty → compose up → health).
#
# SERVERS ARE INFERRED FROM THE GIT PATH
#   `paths` are relative to each tree's config/plugins/:
#     infra/minecraft/<server>/config/plugins/...   → only that backend
#     infra/velocity/config/plugins/...             → only the proxy
#   A main-only edit reloads main only. If the same file changed on main and
#   tech, both get their own copy + reload. Never list servers in a rule.
#
# MERGE, NEVER REPLACE
#   Plugin folders under /srv also hold runtime data (homes, warps, holograms,
#   player files...) that lives in the overlay upper layer (data/state). The
#   agent writes only the exact files that changed in git, through the running
#   container, and deletes only paths git deleted or renamed. Everything else in
#   that folder is left alone — replacing the folder would destroy live data.
#   (Writing data/state directly from the host does not work: overlayfs keeps
#   resolving the lower image inode, so the server reloads the old file.)
#   At boot entrypoint.sh deletes from data/state every path that exists in
#   /config again, so a synced config never survives as a stale copy.
#
# SECRETS
#   Files with __MISPLEASE_*__ placeholders (LuckPerms config.yml, libertybans
#   sql.yml) ARE supported: the agent substitutes the same values entrypoint.sh
#   uses at boot, taken from its own env (DB_PASSWORD, REDIS_PASSWORD), and
#   refuses to write a file if any placeholder is left unresolved. Listing a
#   file with an unknown placeholder is therefore safe: it aborts, it does not
#   write literal tokens into a live config.
#   Sync is per-file, so listing `libertybans/config.yml` cannot drag `sql.yml`
#   along (and vice versa).
#
# NO DATA
#   Only files we track in git may be listed. Runtime files a plugin writes into
#   its own folder are untracked (infra/**/data/ is gitignored) and stay put.
#   `Multiverse-Core/worlds.yml` is tracked but also runtime-written (world
#   creation), so only config.yml is listed there.
#
# RELOAD COMMANDS — ALWAYS NAMESPACED ON BACKENDS
#   Paper resolves `plugin:label`, so every backend rule uses the plugin
#   namespace (`essentials:ess reload`, `jobs:jobs reload`). That way a short
#   alias like `ps`/`dc`/`rs` can't hit another plugin's command if a future
#   plugin registers the same label. The namespace is the plugin *name*
#   lowercased (checked with `plugins`), and the label is the command that
#   plugin registered — not always the same word:
#     - `mvinv` is registered by Multiverse-Core, not Multiverse-Inventories.
#     - ProtectionStones registers `ps` without a plugin namespace, so Paper
#       cannot resolve `protectionstones:ps`; it stays bare (checked: nothing
#       else on the backend registers `ps`).
#   Velocity has NO plugin:command syntax (it answers "No such command"), so
#   proxy rules are bare by necessity. Keep them unambiguous (`libertybans
#   reload`, `sr reload`, `lpv reloadconfig` are all unique on the proxy).
#   Use `rcon_proxy` when the proxy label differs from the backend one
#   (LuckPerms: `lp` on Paper, `lpv` on Velocity).
#   Every command below was executed once on prod main / the proxy and the
#   answer was checked (no "Unknown or incomplete command" / "No such command").
#
# FAILURE HANDLING
#   A failure (sync error, RCON unreachable, command rejected) is retried up to
#   MAX_CONFIG_RELOAD_ATTEMPTS (default 3); after that the agent falls back to
#   the compose path, so the change still lands with a bounce.
#
# ADDING A RULE
#   Check the plugin's docs/source for its reload command, and only enable it if
#   that reload really re-reads the config file we track. Rules are read from the
#   *wanted* revision, so a rule and a config change can ship in one push.
#
# DRY RUN
#   python tools/deploy/agent.py classify <old-sha> <new-sha>

rules:
  - id: actionhealth
    paths:
      - ActionHealth/**
    rcon: actionhealth:actionhealth reload

  - id: advancedregionmarket
    paths:
      - AdvancedRegionMarket/**
    rcon: advancedregionmarket:arm reload

  - id: autosellchests
    paths:
      - AutoSellChests/**
    rcon: autosellchests:asc reload

  - id: betterback
    paths:
      - BetterBack/**
    rcon: betterback:backreload

  # Own plugin, Maven build. Reloads warps/homes config + storage.
  - id: betterwarps
    paths:
      - BetterWarps/**
    rcon: betterwarps:warpsreload

  - id: deathcoordinates
    paths:
      - DeathCoordinates/**
    rcon: deathcoordinates:dc reload

  # Also reloads every hologram. Holograms are runtime data in data/state.
  - id: decentholograms
    paths:
      - DecentHolograms/**
    rcon: decentholograms:dh reload

  # `sreload` re-reads shops/sections/languages. A few config.yml keys still
  # need a restart (documented upstream); those changes are rare.
  - id: economyshopgui
    paths:
      - EconomyShopGUI/**
    rcon: economyshopgui:sreload

  # Most of config.yml/messages/kits. New commands, permissions and economy
  # hooks still need a restart.
  - id: essentials
    paths:
      - Essentials/**
    rcon: essentials:ess reload

  - id: eternaleffects
    paths:
      - EternalEffects/**
    rcon: eternaleffects:eternaleffectsreload

  - id: extracontexts
    paths:
      - ExtraContexts/**
    rcon: extracontexts:extracontexts-reload

  - id: fastasyncworldedit
    paths:
      - FastAsyncWorldEdit/**
    rcon: fastasyncworldedit:we reload

  - id: gravitytubes
    paths:
      - GravityTubes/**
    rcon: gravitytubes:gta reload

  - id: gsit
    paths:
      - GSit/**
    rcon: gsit:gsitreload

  - id: hiddenholograms
    paths:
      - HiddenHolograms/**
    rcon: hiddenholograms:reloadinvisibleholograms

  # config.yml + locale. Adding/removing whole jobs usually needs a restart.
  - id: jobs
    paths:
      - Jobs/**
    rcon: jobs:jobs reload

  # Proxy only (bare: Velocity has no namespacing). Re-reads config.yml, lang
  # files and addons.
  - id: libertybans
    paths:
      - libertybans/config.yml
    rcon: libertybans reload

  # sql.yml is the documented restart case: LibertyBans rebuilds the pool only
  # on `/libertybans restart` (plugin restart, not the proxy). The password
  # placeholder is substituted by the agent.
  - id: libertybans-sql
    paths:
      - libertybans/sql.yml
    rcon: libertybans restart

  # config.yml holds the storage/redis credentials (placeholders, substituted by
  # the agent) plus the settings we actually touch: server, world-rewrite,
  # prefixes-related flags, contexts. Those are re-read; storage/messaging
  # changes are `notReloadable` upstream and still need a restart.
  - id: luckperms
    paths:
      - LuckPerms/config.yml
    rcon: luckperms:lp reloadconfig
    rcon_proxy: lpv reloadconfig

  # worlds.yml is runtime-written (world creation), so it stays out.
  - id: multiverse-core
    paths:
      - Multiverse-Core/config.yml
    rcon: multiverse-core:mv reload

  # `mvinv` is registered by Multiverse-Core (Multiverse-Inventories has no
  # commands of its own), hence the multiverse-core namespace.
  - id: multiverse-inventories
    paths:
      - Multiverse-Inventories/**
    rcon: multiverse-core:mvinv reload

  - id: placeholderapi
    paths:
      - PlaceholderAPI/**
    rcon: placeholderapi:papi reload

  # settings/worlds/components/translations. storage.yml changes (backend
  # switched while running) still need a restart.
  - id: plotsquared
    paths:
      - PlotSquared/**
    rcon: plotsquared:plot reload

  # Bare: ProtectionStones registers `ps` without a plugin namespace, so
  # `protectionstones:ps` does not resolve. Nothing else registers `ps`.
  - id: protectionstones
    paths:
      - ProtectionStones/**
    rcon: ps reload

  - id: quickshop
    paths:
      - QuickShop/**
    rcon: quickshop:qs reload

  - id: rosestacker
    paths:
      - RoseStacker/**
    rcon: rosestacker:rs reload

  # `/ss` is not an alias of SimpleScore (that is `/sb`).
  - id: simplescore
    paths:
      - SimpleScore/**
    rcon: simplescore:simplescore reload

  # Proxy only (bare). Config/messages behaviour keys. Storage, proxy detection
  # or command-registration changes need a restart.
  - id: skinsrestorer
    paths:
      - SkinsRestorer/config.yml
    rcon: sr reload

  # TAB unloads and loads itself on reload: expect a short tab/scoreboard reset.
  - id: tab
    paths:
      - TAB/**
    rcon: tab:tab reload

  - id: thebestrtp
    paths:
      - TheBestRTP/**
    rcon: thebestrtp:rtpreload

  - id: viaversion
    paths:
      - ViaVersion/**
    rcon: viaversion:viaversion reload

  - id: villagertradelimiter
    paths:
      - VillagerTradeLimiter/**
    rcon: villagertradelimiter:vtl reload

  # WorldGuard/worlds/ is region data (gitignored, never in a diff).
  - id: worldguard
    paths:
      - WorldGuard/config.yml
    rcon: worldguard:wg reload

# ---------------------------------------------------------------------------
# Checked and deliberately NOT listed. Do not "fix" these by guessing a command.
#
#   AutoConsoleCommands   no command; config is read in onEnable only
#   AutoPlayerTeleport    its reload command is literally `/reload`, which
#                         collides with Paper's; over RCON you cannot be sure
#   BiomePrinter          no command; re-reads lazily on the next print
#   Chunky                only `chunky reload tasks`; nothing useful for config
#   ChunkyBorder          no reload command in 1.2.x
#   CMILib                `cmil reload` answers "Unknown CMILib command source
#                         (Rcon)": it refuses RCON senders, so it cannot be
#                         driven by the agent
#   ColoredSigns          listener-only plugin, no commands
#   dynmap                the reload subcommand is commented out upstream
#   FastAsyncVoxelSniper  undocumented reload command, needs verification first
#   floodgate             no reload command (`geyser reload` does not touch it)
#   Geyser-Velocity       `geyser reload` kicks every Bedrock session
#   GriefPrevention       not verified yet
#   LightCleaner          no reload command
#   PlayMoreSounds        the plugin itself prints "does not support reloads"
#   Slimefun              no reload subcommand in the 26.3 fork
#   SuperiorSkyblock2     `sadmin reload` exists but the jar warns it can leave
#                         the plugin half-initialised: not worth the risk
#   TrackPlayTime         no reload command
#   Vault                 no reload command
#   our own plugins       backend-*, PortalRoutes, WorldGamerules,
#                         WorldGameMode, WorldPrinter: no reload command yet.
#                         Add one to the plugin (Kotlin) when we start touching
#                         their config often, then list it here.
# ---------------------------------------------------------------------------
