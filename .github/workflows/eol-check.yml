name: eol-check

# Floating tags only receive patches while their line is supported, and nothing
# on the host notices when upstream drops it. Weekly check against endoflife.date
# (see tools/eol/check.py); opens or updates one issue when a line is EOL, about
# to be, or vanished from the data set. Closes it when everything is supported.
#
# Not on the self-hosted runner: it has docker.sock and no business here.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  ISSUE_TITLE: "Base image line out of support"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check supported lines
        id: check
        run: |
          set -o pipefail
          set +e
          python3 tools/eol/check.py | tee eol.txt
          echo "status=$?" >> "$GITHUB_OUTPUT"

      - name: Open or update the issue
        if: steps.check.outputs.status != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          body="$(printf 'Weekly `tools/eol/check.py` run.\n\n```\n%s\n```\n' "$(cat eol.txt)")"
          number="$(gh issue list --state open --search "${ISSUE_TITLE} in:title" \
            --json number,title \
            --jq '.[] | select(.title == "'"${ISSUE_TITLE}"'") | .number' | head -n1)"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$ISSUE_TITLE" --body "$body"
          fi

      - name: Close the issue when everything is supported again
        if: steps.check.outputs.status == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for number in $(gh issue list --state open --search "${ISSUE_TITLE} in:title" \
            --json number,title \
            --jq '.[] | select(.title == "'"${ISSUE_TITLE}"'") | .number'); do
            gh issue close "$number" --comment "All checked lines are supported again."
          done
