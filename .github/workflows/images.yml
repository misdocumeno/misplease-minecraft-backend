# Prod pipeline: push to main (paths) or manual dispatch → build, smoke, push GHCR.
# Hosts never build: docker compose -f docker-compose.prod.yml pull && up -d
name: images

on:
  push:
    branches: [main]
    paths:
      - "docker/**"
      - "docker-compose.yml"
      - "docker-compose.prod.yml"
      - "infra/**"
      - "plugins/**"
      - "services/auth/**"
      - "tools/plugin-lock/**"
      - ".github/workflows/images.yml"
  pull_request:
    paths:
      - "docker/**"
      - "docker-compose.yml"
      - "docker-compose.prod.yml"
      - "infra/**"
      - "plugins/**"
      - "services/auth/**"
      - "tools/plugin-lock/**"
      - ".github/workflows/images.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  # Push images on main builds and manual runs; PRs only load+smoke locally on the runner.
  PUSH_IMAGES: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}

jobs:
  auth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: env.PUSH_IMAGES == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./services/auth
          push: ${{ env.PUSH_IMAGES == 'true' }}
          tags: |
            ghcr.io/${{ github.repository }}/auth:${{ github.sha }}
            ghcr.io/${{ github.repository }}/auth:dev
          cache-from: type=gha,scope=auth
          cache-to: type=gha,mode=max,scope=auth

  servers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: main
            lock: infra/minecraft/main/plugins-lock.yml
            prefix: backend-
            kind: server
            config: infra/minecraft/main/config
            runtime_java: "25"
            smoke: true
          - name: tech
            lock: infra/minecraft/tech/plugins-lock.yml
            prefix: backend-
            kind: server
            config: infra/minecraft/tech/config
            runtime_java: "25"
            smoke: true
          - name: velocity
            lock: infra/velocity/plugins-lock.yml
            prefix: velocity-
            kind: proxy
            config: infra/velocity/config
            runtime_java: "25"
            smoke: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tools/plugin-lock/package-lock.json

      # JDK/Maven used when a lock entry is source: git (self-provisioned by plugin-lock).
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/misplease
          key: misplease-tools-${{ runner.os }}-${{ github.run_id }}-${{ matrix.name }}
          restore-keys: |
            misplease-tools-${{ runner.os }}-

      # npm deps for the local JS action + CLI (ACTION gets ACTIONS_RUNTIME_TOKEN;
      # a plain `run:` step does not, so @actions/cache cannot run from shell alone).
      - name: Install plugin-lock
        working-directory: tools/plugin-lock
        run: npm ci --omit=dev --ignore-scripts

      # Materialize this server's lock. Per-entry keys: plugin-jar-<sha256(entry)>.
      - name: Materialize lock jars
        uses: ./tools/plugin-lock
        env:
          GITHUB_TOKEN: ${{ secrets.PLUGIN_GITHUB_TOKEN }}
        with:
          lock: ${{ github.workspace }}/${{ matrix.lock }}
          out: ${{ github.workspace }}/.materialize/${{ matrix.name }}/jars
          server-out: ${{ github.workspace }}/.materialize/${{ matrix.name }}/server
          cache-dir: ${{ github.workspace }}/.plugin-lock-cache

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: ~/.cache/misplease
          key: misplease-tools-${{ runner.os }}-${{ github.run_id }}-${{ matrix.name }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: env.PUSH_IMAGES == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Image build only copies host-materialized jars + compiles our plugins.
      # Dummy plugin-cache context satisfies the local Dockerfile branch's FROM name;
      # LOCK_VARIANT=ci selects fetch-ci (lock-jars / lock-server) instead.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/server.Dockerfile
          load: true
          push: false
          build-contexts: |
            plugin-cache=docker/empty-plugin-cache
            lock-jars=.materialize/${{ matrix.name }}/jars
            lock-server=.materialize/${{ matrix.name }}/server
          build-args: |
            LOCK=${{ matrix.lock }}
            PLUGIN_PREFIX=${{ matrix.prefix }}
            RUNTIME_JAVA=${{ matrix.runtime_java }}
            LOCK_VARIANT=ci
          cache-from: type=gha,scope=server-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=server-${{ matrix.name }}
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.name }}:smoke

      - name: Smoke boot
        if: matrix.smoke
        run: |
          chmod +x docker/smoke-check.sh
          SMOKE_HEAP=1536M SMOKE_TIMEOUT_S=360 \
            ./docker/smoke-check.sh \
            "ghcr.io/${{ github.repository }}/${{ matrix.name }}:smoke" \
            "${{ matrix.kind }}" \
            "${{ matrix.config }}"

      - name: Push to GHCR
        if: env.PUSH_IMAGES == 'true'
        run: |
          set -eux
          image="ghcr.io/${{ github.repository }}/${{ matrix.name }}"
          docker tag "${image}:smoke" "${image}:${{ github.sha }}"
          docker tag "${image}:smoke" "${image}:dev"
          docker push "${image}:${{ github.sha }}"
          docker push "${image}:dev"
