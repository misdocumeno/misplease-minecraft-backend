# Prod pipeline: push to main (paths) or manual dispatch → build, smoke, push GHCR.
# Hosts never build: docker compose -f docker-compose.prod.yml pull && up -d
name: images

on:
  push:
    branches: [main]
    paths:
      - "docker/**"
      - "docker-compose.yml"
      - "docker-compose.prod.yml"
      - "infra/**"
      - "plugins/**"
      - "services/auth/**"
      - "tools/plugin-lock/**"
      - ".github/workflows/images.yml"
  pull_request:
    paths:
      - "docker/**"
      - "docker-compose.yml"
      - "docker-compose.prod.yml"
      - "infra/**"
      - "plugins/**"
      - "services/auth/**"
      - "tools/plugin-lock/**"
      - ".github/workflows/images.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  # Push images on main builds and manual runs; PRs only load+smoke locally on the runner.
  PUSH_IMAGES: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}

jobs:
  # Warm .plugin-lock-cache for every infra/**/plugins-lock.yml before any image build.
  # Shared Actions cache (not BuildKit): hash-keyed jars survive failed/cancelled image builds.
  # New servers: add infra/**/plugins-lock.yml (+ matrix entry); prefetch picks them up via find.
  jar-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache/restore@v4
        id: restore
        with:
          path: |
            .plugin-lock-cache
            ~/.cache/misplease
          # hashFiles only works inside job steps, not workflow-level env.
          key: plugin-lock-jars-${{ hashFiles('infra/**/plugins-lock.yml', 'tools/plugin-lock/src/**', 'tools/plugin-lock/package-lock.json') }}
          restore-keys: |
            plugin-lock-jars-

      - uses: actions/setup-node@v4
        if: steps.restore.outputs.cache-hit != 'true'
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tools/plugin-lock/package-lock.json

      - name: Prefetch all plugin locks
        if: steps.restore.outputs.cache-hit != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.PLUGIN_GITHUB_TOKEN }}
          PLUGIN_LOCK_CACHE: ${{ github.workspace }}/.plugin-lock-cache
        run: |
          set -eux
          cd tools/plugin-lock
          npm ci --omit=dev --ignore-scripts
          mkdir -p "$PLUGIN_LOCK_CACHE"
          # Any new server under infra/** with a plugins-lock.yml is included automatically.
          mapfile -t locks < <(find "${{ github.workspace }}/infra" -type f -name 'plugins-lock.yml' | sort)
          if [ "${#locks[@]}" -eq 0 ]; then
            echo "no plugins-lock.yml under infra/" >&2
            exit 1
          fi
          for lock in "${locks[@]}"; do
            rel="${lock#${{ github.workspace }}/}"
            out="${{ github.workspace }}/.prefetch/$(echo "$rel" | tr '/' '_')"
            mkdir -p "$out/jars" "$out/server"
            echo "prefetch $rel"
            node src/cli.ts download --lock "$lock" --out "$out/jars" --server-out "$out/server"
          done
          du -sh "$PLUGIN_LOCK_CACHE" ~/.cache/misplease 2>/dev/null || true

      - uses: actions/cache/save@v4
        if: always() && steps.restore.outputs.cache-hit != 'true'
        with:
          path: |
            .plugin-lock-cache
            ~/.cache/misplease
          key: plugin-lock-jars-${{ hashFiles('infra/**/plugins-lock.yml', 'tools/plugin-lock/src/**', 'tools/plugin-lock/package-lock.json') }}

  auth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: env.PUSH_IMAGES == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./services/auth
          push: ${{ env.PUSH_IMAGES == 'true' }}
          tags: |
            ghcr.io/${{ github.repository }}/auth:${{ github.sha }}
            ghcr.io/${{ github.repository }}/auth:dev
          cache-from: type=gha,scope=auth
          cache-to: type=gha,mode=max,scope=auth

  servers:
    needs: jar-cache
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: main
            lock: infra/minecraft/main/plugins-lock.yml
            prefix: backend-
            kind: server
            config: infra/minecraft/main/config
            runtime_java: "21"
            smoke: true
          - name: tech
            lock: infra/minecraft/tech/plugins-lock.yml
            prefix: backend-
            kind: server
            config: infra/minecraft/tech/config
            runtime_java: "25"
            smoke: true
          - name: velocity
            lock: infra/velocity/plugins-lock.yml
            prefix: velocity-
            kind: proxy
            config: infra/velocity/config
            runtime_java: "21"
            smoke: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache/restore@v4
        with:
          path: |
            .plugin-lock-cache
            ~/.cache/misplease
          key: plugin-lock-jars-${{ hashFiles('infra/**/plugins-lock.yml', 'tools/plugin-lock/src/**', 'tools/plugin-lock/package-lock.json') }}
          restore-keys: |
            plugin-lock-jars-

      - name: Ensure plugin-cache context
        run: mkdir -p .plugin-lock-cache

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: env.PUSH_IMAGES == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Load locally for smoke. Push is a separate docker push so load+push cannot
      # race GHCR package creation (velocity hit write_package with both enabled).
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/server.Dockerfile
          load: true
          push: false
          build-contexts: |
            plugin-cache=.plugin-lock-cache
          build-args: |
            LOCK=${{ matrix.lock }}
            PLUGIN_PREFIX=${{ matrix.prefix }}
            RUNTIME_JAVA=${{ matrix.runtime_java }}
          secrets: |
            github_token=${{ secrets.PLUGIN_GITHUB_TOKEN }}
          cache-from: type=gha,scope=server-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=server-${{ matrix.name }}
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.name }}:smoke

      - name: Smoke boot
        if: matrix.smoke
        run: |
          chmod +x docker/smoke-check.sh
          # Standard GHA runners have ~7GiB RAM; keep the heap well under that
          # (Docker + Postgres + Redis share the machine). Prod heaps stay in compose.prod.
          SMOKE_HEAP=1536M SMOKE_TIMEOUT_S=360 \
            ./docker/smoke-check.sh \
            "ghcr.io/${{ github.repository }}/${{ matrix.name }}:smoke" \
            "${{ matrix.kind }}" \
            "${{ matrix.config }}"

      - name: Push to GHCR
        if: env.PUSH_IMAGES == 'true'
        run: |
          set -eux
          image="ghcr.io/${{ github.repository }}/${{ matrix.name }}"
          docker tag "${image}:smoke" "${image}:${{ github.sha }}"
          docker tag "${image}:smoke" "${image}:dev"
          docker push "${image}:${{ github.sha }}"
          docker push "${image}:dev"
