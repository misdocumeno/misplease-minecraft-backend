# Prod pipeline: push to main (paths) or manual dispatch → build, smoke, push GHCR.
# Hosts never build: docker compose -f docker-compose.prod.yml pull && up -d
#
# BuildKit cache speeds unchanged layers, but each matrix cell still pays
# materialize + smoke. A paths-filter job skips cells that cannot be affected.
name: images

on:
  push:
    branches: [main]
    paths:
      - "docker/**"
      - "docker-compose.yml"
      - "docker-compose.prod.yml"
      - "infra/**"
      - "plugins/**"
      - "services/auth/**"
      - "tools/plugin-lock/**"
      - ".github/workflows/images.yml"
  pull_request:
    paths:
      - "docker/**"
      - "docker-compose.yml"
      - "docker-compose.prod.yml"
      - "infra/**"
      - "plugins/**"
      - "services/auth/**"
      - "tools/plugin-lock/**"
      - ".github/workflows/images.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  pull-requests: read
  # List/delete Actions caches after rotating gradle-mount keys (avoid 10GB LRU thrash).
  actions: write

env:
  # Push images on main builds and manual runs; PRs only load+smoke locally on the runner.
  PUSH_IMAGES: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      auth: ${{ steps.resolve.outputs.auth }}
      servers_json: ${{ steps.resolve.outputs.servers_json }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            auth:
              - 'services/auth/**'
            shared:
              - 'docker/**'
              - 'docker-compose.yml'
              - 'docker-compose.prod.yml'
              - 'tools/plugin-lock/**'
              - '.github/workflows/images.yml'
            plugins_all:
              - 'plugins/buildSrc/**'
              - 'plugins/gradle/**'
              - 'plugins/settings.gradle.kts'
              - 'plugins/build.gradle.kts'
              - 'plugins/gradle.properties'
              - 'plugins/libs.versions.toml'
              - 'plugins/gradle/libs.versions.toml'
            plugins_backend:
              - 'plugins/backend-*/**'
            plugins_velocity:
              - 'plugins/velocity-*/**'
            main:
              - 'infra/minecraft/main/**'
            tech:
              - 'infra/minecraft/tech/**'
            velocity:
              - 'infra/velocity/**'

      - id: resolve
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            auth=true
            main=true
            tech=true
            velocity=true
          else
            f_auth='${{ steps.filter.outputs.auth }}'
            f_shared='${{ steps.filter.outputs.shared }}'
            f_plugins_all='${{ steps.filter.outputs.plugins_all }}'
            f_plugins_backend='${{ steps.filter.outputs.plugins_backend }}'
            f_plugins_velocity='${{ steps.filter.outputs.plugins_velocity }}'
            f_main='${{ steps.filter.outputs.main }}'
            f_tech='${{ steps.filter.outputs.tech }}'
            f_velocity='${{ steps.filter.outputs.velocity }}'

            # Shared docker/lock/workflow or Gradle root → every image.
            if [[ "$f_shared" == "true" || "$f_plugins_all" == "true" ]]; then
              auth=true
              main=true
              tech=true
              velocity=true
            else
              auth=false
              main=false
              tech=false
              velocity=false
              [[ "$f_auth" == "true" ]] && auth=true
              [[ "$f_plugins_backend" == "true" || "$f_main" == "true" ]] && main=true
              [[ "$f_plugins_backend" == "true" || "$f_tech" == "true" ]] && tech=true
              [[ "$f_plugins_velocity" == "true" || "$f_velocity" == "true" ]] && velocity=true
            fi
          fi

          cells=()
          if [[ "$main" == "true" ]]; then
            cells+=('{"name":"main","lock":"infra/minecraft/main/plugins-lock.yml","prefix":"backend-","kind":"server","config":"infra/minecraft/main/config","runtime_java":"25","smoke":true}')
          fi
          if [[ "$tech" == "true" ]]; then
            cells+=('{"name":"tech","lock":"infra/minecraft/tech/plugins-lock.yml","prefix":"backend-","kind":"server","config":"infra/minecraft/tech/config","runtime_java":"25","smoke":true}')
          fi
          if [[ "$velocity" == "true" ]]; then
            cells+=('{"name":"velocity","lock":"infra/velocity/plugins-lock.yml","prefix":"velocity-","kind":"proxy","config":"infra/velocity/config","runtime_java":"25","smoke":true}')
          fi

          if ((${#cells[@]})); then
            servers_json="[$(IFS=,; echo "${cells[*]}")]"
          else
            servers_json='[]'
          fi

          echo "auth=$auth" >> "$GITHUB_OUTPUT"
          echo "servers_json=$servers_json" >> "$GITHUB_OUTPUT"
          echo "Resolved auth=$auth servers=$servers_json"

  auth:
    needs: changes
    if: needs.changes.outputs.auth == 'true'
    # Pin major runner image (not ubuntu-latest — that already jumped to 26.04).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: env.PUSH_IMAGES == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./services/auth
          push: ${{ env.PUSH_IMAGES == 'true' }}
          tags: |
            ghcr.io/${{ github.repository }}/auth:${{ github.sha }}
            ghcr.io/${{ github.repository }}/auth:dev
          cache-from: type=gha,scope=auth
          cache-to: type=gha,mode=max,scope=auth

  servers:
    needs: changes
    if: needs.changes.outputs.servers_json != '[]'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.changes.outputs.servers_json) }}
    # Exact key rotates when our plugin Gradle deps/toolchain change; prefix is for restore-keys + cleanup.
    # Job-level env cannot use `runner.*` (workflow parse fails); runners are ubuntu-24.04 → Linux.
    env:
      GRADLE_MOUNT_PREFIX: gradle-mount-Linux-${{ matrix.name }}-
      GRADLE_MOUNT_KEY: gradle-mount-Linux-${{ matrix.name }}-${{ hashFiles('plugins/gradle/wrapper/gradle-wrapper.properties', 'plugins/gradle/libs.versions.toml', 'plugins/**/build.gradle.kts', 'plugins/settings.gradle.kts', 'plugins/build.gradle.kts', 'plugins/buildSrc/**/*.kts') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tools/plugin-lock/package-lock.json

      # JDK/Maven for source: git (plugin-lock). Stable key — contents rarely change.
      # Do not put run_id in the key (immutable Actions caches would duplicate GB every run).
      - uses: actions/cache/restore@v4
        id: misplease-tools
        with:
          path: ~/.cache/misplease
          key: misplease-tools-${{ runner.os }}-temurin-maven
          restore-keys: |
            misplease-tools-${{ runner.os }}-

      # npm deps for the local JS action + CLI (ACTION gets ACTIONS_RUNTIME_TOKEN;
      # a plain `run:` step does not, so @actions/cache cannot run from shell alone).
      # setup-node cache key already tracks package-lock.json (no run_id).
      - name: Install plugin-lock
        working-directory: tools/plugin-lock
        run: npm ci --omit=dev --ignore-scripts

      # Materialize this server's lock. Per-entry keys: plugin-jar-<sha256(entry)>.
      - name: Materialize lock jars
        uses: ./tools/plugin-lock
        env:
          GITHUB_TOKEN: ${{ secrets.PLUGIN_GITHUB_TOKEN }}
        with:
          lock: ${{ github.workspace }}/${{ matrix.lock }}
          out: ${{ github.workspace }}/.materialize/${{ matrix.name }}/jars
          server-out: ${{ github.workspace }}/.materialize/${{ matrix.name }}/server
          cache-dir: ${{ github.workspace }}/.plugin-lock-cache

      - uses: actions/cache/save@v4
        if: always() && steps.misplease-tools.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/misplease
          key: misplease-tools-${{ runner.os }}-temurin-maven

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: env.PUSH_IMAGES == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # BuildKit cache mounts are NOT stored in cache-to type=gha. Persist via
      # actions/cache + cache-dance (inject → build → extract → save). Extract is
      # explicit so it still runs when smoke fails afterward.
      - name: Prepare Gradle mount dirs
        run: mkdir -p .gradle-ci/caches .gradle-ci/wrapper

      # Persists BuildKit gradle mounts via cache-dance. Key = toolchain + our plugin Gradle
      # files (deps). Source .class outputs live under build/, not here. Save only on miss;
      # after save, delete superseded keys with the same prefix (controlled rotation).
      - name: Restore Gradle BuildKit mounts
        uses: actions/cache/restore@v4
        id: gradle-mount
        with:
          path: |
            .gradle-ci/caches
            .gradle-ci/wrapper
          key: ${{ env.GRADLE_MOUNT_KEY }}
          restore-keys: |
            ${{ env.GRADLE_MOUNT_PREFIX }}

      - name: Inject Gradle mounts into BuildKit
        uses: reproducible-containers/buildkit-cache-dance@v3.1.2
        with:
          skip-extraction: true
          cache-map: |
            {
              ".gradle-ci/caches": {
                "target": "/root/.gradle/caches",
                "id": "misplease-gradle-caches"
              },
              ".gradle-ci/wrapper": {
                "target": "/root/.gradle/wrapper",
                "id": "misplease-gradle-wrapper"
              }
            }

      # Image build only copies host-materialized jars + compiles our plugins.
      # Dummy plugin-cache context satisfies the local Dockerfile branch's FROM name;
      # LOCK_VARIANT=ci selects fetch-ci (lock-jars / lock-server) instead.
      - uses: docker/build-push-action@v6
        id: server-image
        with:
          context: .
          file: docker/server.Dockerfile
          load: true
          push: false
          build-contexts: |
            plugin-cache=docker/empty-plugin-cache
            lock-jars=.materialize/${{ matrix.name }}/jars
            lock-server=.materialize/${{ matrix.name }}/server
          build-args: |
            LOCK=${{ matrix.lock }}
            PLUGIN_PREFIX=${{ matrix.prefix }}
            RUNTIME_JAVA=${{ matrix.runtime_java }}
            LOCK_VARIANT=ci
          cache-from: type=gha,scope=server-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=server-${{ matrix.name }}
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.name }}:smoke

      # STATE_POST makes the action's main entrypoint run extract (see cache-dance opts).
      # skip-extraction must be false here or extractCaches() no-ops.
      - name: Extract Gradle mounts from BuildKit
        if: always() && steps.server-image.outcome == 'success'
        uses: reproducible-containers/buildkit-cache-dance@v3.1.2
        env:
          STATE_POST: "true"
        with:
          skip-extraction: false
          cache-map: |
            {
              ".gradle-ci/caches": {
                "target": "/root/.gradle/caches",
                "id": "misplease-gradle-caches"
              },
              ".gradle-ci/wrapper": {
                "target": "/root/.gradle/wrapper",
                "id": "misplease-gradle-wrapper"
              }
            }

      - name: Save Gradle BuildKit mounts
        id: gradle-mount-save
        if: always() && steps.server-image.outcome == 'success' && steps.gradle-mount.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .gradle-ci/caches
            .gradle-ci/wrapper
          key: ${{ env.GRADLE_MOUNT_KEY }}

      # After rotating to a new exact key, drop older gradle-mount-* for this matrix cell
      # so GitHub LRU does not evict small plugin-jar caches first.
      - name: Drop superseded gradle-mount caches
        if: always() && steps.gradle-mount-save.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          keep="${GRADLE_MOUNT_KEY}"
          prefix="${GRADLE_MOUNT_PREFIX}"
          echo "Keeping exact key: ${keep}"
          echo "Deleting other keys with prefix: ${prefix}"
          deleted=0
          while IFS=$'\t' read -r id key; do
            [[ -n "$id" ]] || continue
            if [[ "$key" == "$keep" ]]; then
              echo "keep id=${id} key=${key}"
              continue
            fi
            echo "delete id=${id} key=${key}"
            gh cache delete "$id" -R "${{ github.repository }}"
            deleted=$((deleted + 1))
          done < <(
            gh cache list -R "${{ github.repository }}" -L 100 -k "${prefix}" \
              --json id,key \
              --jq '.[] | [.id, .key] | @tsv'
          )
          echo "Deleted ${deleted} superseded cache(s)."

      - name: Smoke boot
        if: matrix.smoke
        run: |
          chmod +x docker/smoke-check.sh
          SMOKE_HEAP=1536M SMOKE_TIMEOUT_S=360 \
            ./docker/smoke-check.sh \
            "ghcr.io/${{ github.repository }}/${{ matrix.name }}:smoke" \
            "${{ matrix.kind }}" \
            "${{ matrix.config }}"

      - name: Push to GHCR
        if: env.PUSH_IMAGES == 'true'
        run: |
          set -eux
          image="ghcr.io/${{ github.repository }}/${{ matrix.name }}"
          docker tag "${image}:smoke" "${image}:${{ github.sha }}"
          docker tag "${image}:smoke" "${image}:dev"
          docker push "${image}:${{ github.sha }}"
          docker push "${image}:dev"
