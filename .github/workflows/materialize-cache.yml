# Optional: warm Actions jar keys (plugin-jar-<entryHash>) by downloading every lock.
# images.yml already materializes per server on each run; use this after Spiget flakes, etc.
name: materialize-cache

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tools/plugin-lock/package-lock.json

      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/misplease
          key: misplease-tools-${{ runner.os }}-${{ github.run_id }}-manual
          restore-keys: |
            misplease-tools-${{ runner.os }}-

      - name: Install plugin-lock
        working-directory: tools/plugin-lock
        run: npm ci --omit=dev --ignore-scripts

      - name: Materialize main
        uses: ./tools/plugin-lock
        env:
          GITHUB_TOKEN: ${{ secrets.PLUGIN_GITHUB_TOKEN }}
        with:
          lock: ${{ github.workspace }}/infra/minecraft/main/plugins-lock.yml
          out: ${{ github.workspace }}/.materialize/main/jars
          server-out: ${{ github.workspace }}/.materialize/main/server
          cache-dir: ${{ github.workspace }}/.plugin-lock-cache

      - name: Materialize tech
        uses: ./tools/plugin-lock
        env:
          GITHUB_TOKEN: ${{ secrets.PLUGIN_GITHUB_TOKEN }}
        with:
          lock: ${{ github.workspace }}/infra/minecraft/tech/plugins-lock.yml
          out: ${{ github.workspace }}/.materialize/tech/jars
          server-out: ${{ github.workspace }}/.materialize/tech/server
          cache-dir: ${{ github.workspace }}/.plugin-lock-cache

      - name: Materialize velocity
        uses: ./tools/plugin-lock
        env:
          GITHUB_TOKEN: ${{ secrets.PLUGIN_GITHUB_TOKEN }}
        with:
          lock: ${{ github.workspace }}/infra/velocity/plugins-lock.yml
          out: ${{ github.workspace }}/.materialize/velocity/jars
          server-out: ${{ github.workspace }}/.materialize/velocity/server
          cache-dir: ${{ github.workspace }}/.plugin-lock-cache

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: ~/.cache/misplease
          key: misplease-tools-${{ runner.os }}-${{ github.run_id }}-manual
