# Optional: warm Actions jar keys (plugin-jar-<entryHash>) by downloading every lock.
# images.yml already materializes per server on each run; use this after Spiget flakes, etc.
name: materialize-cache

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tools/plugin-lock/package-lock.json

      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/misplease
          key: misplease-tools-${{ runner.os }}-${{ github.run_id }}-manual
          restore-keys: |
            misplease-tools-${{ runner.os }}-

      - name: Download all plugin locks
        env:
          GITHUB_TOKEN: ${{ secrets.PLUGIN_GITHUB_TOKEN }}
          PLUGIN_LOCK_CACHE: ${{ github.workspace }}/.plugin-lock-cache
        run: |
          set -eux
          cd tools/plugin-lock
          npm ci --omit=dev --ignore-scripts
          mkdir -p "$PLUGIN_LOCK_CACHE"
          mapfile -t locks < <(find "${{ github.workspace }}/infra" -type f -name 'plugins-lock.yml' | sort)
          for lock in "${locks[@]}"; do
            rel="${lock#${{ github.workspace }}/}"
            out="${{ github.workspace }}/.materialize/$(echo "$rel" | tr '/' '_')"
            mkdir -p "$out/jars" "$out/server"
            echo "materialize $rel"
            node src/cli.ts download --lock "$lock" --out "$out/jars" --server-out "$out/server"
          done
          du -sh "$PLUGIN_LOCK_CACHE" ~/.cache/misplease 2>/dev/null || true

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: ~/.cache/misplease
          key: misplease-tools-${{ runner.os }}-${{ github.run_id }}-manual
