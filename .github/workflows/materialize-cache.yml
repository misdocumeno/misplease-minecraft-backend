# Optional manual warm of the shared plugin-lock jar cache (same key as images.yml).
# Prefer the automatic jar-cache job on images; use this to refresh after Spiget flakes.
name: materialize-cache

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache/restore@v4
        id: restore
        with:
          path: |
            .plugin-lock-cache
            ~/.cache/misplease
          key: plugin-lock-jars-${{ hashFiles('infra/**/plugins-lock.yml', 'tools/plugin-lock/src/**', 'tools/plugin-lock/package-lock.json') }}
          restore-keys: |
            plugin-lock-jars-

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tools/plugin-lock/package-lock.json

      - name: Download all plugin locks
        env:
          GITHUB_TOKEN: ${{ secrets.PLUGIN_GITHUB_TOKEN }}
          PLUGIN_LOCK_CACHE: ${{ github.workspace }}/.plugin-lock-cache
        run: |
          set -eux
          cd tools/plugin-lock
          npm ci --omit=dev --ignore-scripts
          mkdir -p "$PLUGIN_LOCK_CACHE"
          mapfile -t locks < <(find "${{ github.workspace }}/infra" -type f -name 'plugins-lock.yml' | sort)
          for lock in "${locks[@]}"; do
            rel="${lock#${{ github.workspace }}/}"
            out="${{ github.workspace }}/.prefetch/$(echo "$rel" | tr '/' '_')"
            mkdir -p "$out/jars" "$out/server"
            echo "prefetch $rel"
            node src/cli.ts download --lock "$lock" --out "$out/jars" --server-out "$out/server"
          done
          du -sh "$PLUGIN_LOCK_CACHE" ~/.cache/misplease 2>/dev/null || true

      - uses: actions/cache/save@v4
        if: always() && steps.restore.outputs.cache-hit != 'true'
        with:
          path: |
            .plugin-lock-cache
            ~/.cache/misplease
          key: plugin-lock-jars-${{ hashFiles('infra/**/plugins-lock.yml', 'tools/plugin-lock/src/**', 'tools/plugin-lock/package-lock.json') }}
