# After a successful images push on main, deploy on the self-hosted runner
# (GitHub label `self-hosted` — see docs for self-hosted runners).
# If anyone is online, the job stays pending until the proxy has been empty for
# EMPTY_SECONDS (default 60). A newer successful images run cancels this wait.
#
# HARD RULE: never attach pull_request / fork workflows to runs-on: [self-hosted]
# (docker.sock = root on the host). Only trusted main (via images→deploy) and
# workflow_dispatch. After empty grace, deploy enables Redis maintenance so
# Velocity denies joins for the bounce window.
name: deploy

on:
  workflow_run:
    workflows: [images]
    types: [completed]
  workflow_dispatch:
    inputs:
      empty_seconds:
        description: Seconds the proxy must stay empty before compose up
        required: false
        default: "60"

concurrency:
  group: misplease-prod-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    # Docs: begin with self-hosted, then OS/arch defaults GitHub assigns on register.
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Checkout deploy script
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Wait empty + compose pull/up
        env:
          MISPLEASE_ROOT: ${{ vars.MISPLEASE_ROOT }}
          COMPOSE_FILE: docker-compose.prod.yml
          EMPTY_SECONDS: ${{ github.event.inputs.empty_seconds || '60' }}
          POLL_SECONDS: "5"
          MAX_WAIT_SECONDS: "0"
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          # Prefer Redis SoT (compose runner injects REDIS_URL / REDIS_PASSWORD into the job env).
          REDIS_URL: ${{ vars.REDIS_URL }}
        run: |
          set -euo pipefail
          if [[ -d /misplease ]]; then
            export MISPLEASE_ROOT=/misplease
          else
            export MISPLEASE_ROOT="${MISPLEASE_ROOT:-/home/mis/misplease}"
          fi
          if [[ -z "${REDIS_URL:-}" ]] && [[ -n "${REDIS_PASSWORD:-}" ]]; then
            export REDIS_URL="redis://:${REDIS_PASSWORD}@redis:6379/0"
          fi
          if ! command -v redis-cli >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq redis-tools
          fi
          cp "${GITHUB_WORKSPACE}/tools/deploy/wait-empty-and-deploy.sh" /tmp/misplease-wait-empty-and-deploy.sh
          chmod +x /tmp/misplease-wait-empty-and-deploy.sh
          /tmp/misplease-wait-empty-and-deploy.sh
