# Pin wanted SHA on the host. The ops `deployer` reconciles:
#   - hot-reload.yml-only diffs → sync overlay upper + RCON (live)
#   - obs-only diffs (docker-compose.obs.yml, tools/obs/**) → obs compose only,
#     no maintenance, no empty gate, no game bounce
#   - anything else → empty gate + compose pull/up + health
#
# Triggers (never race images):
#   - successful `images` workflow_run on main push (after build+smoke+GHCR tags)
#   - workflow_dispatch (manual pin)
#   - push that only touches deploy agent / obs / this workflow (no image rebuild)
#
# A push trigger fires immediately, so it must skip mixed commits: one that also
# changes image inputs pins `wanted` before GHCR has the tag and before smoke
# (8762418 did exactly that and armed maintenance on a SHA that never published).
# The gate below pins here only when every changed file is obs/deploy-agent; the
# `images` workflow_run pins everything else once smoke is green.
#
# Do NOT trigger on every main push in parallel with `images`: that pinned wanted
# before tags existed and before smoke. Failed smoke → images conclusion≠success
# → set-wanted must not run.
#
# HARD RULE: never attach pull_request / fork workflows to runs-on: [self-hosted]
# (docker.sock = root on the host). Only trusted main and workflow_dispatch.
name: deploy

on:
  workflow_run:
    workflows: [images]
    types: [completed]
  workflow_dispatch:
    inputs:
      sha:
        description: Git SHA to set as deploy wanted (default = this commit)
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - "tools/deploy/**"
      # Observability has no image: a push that only touches it still has to pin
      # `wanted` so the reconciler applies the obs compose project.
      - "docker-compose.obs.yml"
      - "tools/obs/**"
      - ".github/workflows/deploy.yml"

concurrency:
  group: misplease-deploy-wanted
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  set-wanted:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Checkout set-wanted helper
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Decide whether this push may pin wanted
        id: gate
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          python3 - "$REPO" "$SHA" "$BEFORE" <<'PY'
          import json, os, sys, urllib.request

          repo, sha, before = sys.argv[1], sys.argv[2], sys.argv[3]
          # A push can carry several commits (we often push a batch): judge the
          # whole range, not just the tip, or a deploy-only tip hides an earlier
          # commit that rebuilds the images.
          if before and set(before) != {"0"}:
              url = f"https://api.github.com/repos/{repo}/compare/{before}...{sha}"
          else:
              url = f"https://api.github.com/repos/{repo}/commits/{sha}"
          req = urllib.request.Request(
              url,
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "User-Agent": "misplease-deploy-gate",
              },
          )
          with urllib.request.urlopen(req, timeout=30) as r:
              files = [f["filename"] for f in json.load(r).get("files") or []]

          # Only these never change an image. Anything else (including paths added
          # to images.yml later) counts as image-affecting: fail safe, wait for
          # the images workflow_run instead of racing GHCR.
          def pin_only(path: str) -> bool:
              return (
                  path == "docker-compose.obs.yml"
                  or path == ".github/workflows/deploy.yml"
                  or path.startswith("tools/deploy/")
                  or path.startswith("tools/obs/")
              )

          other = [f for f in files if not pin_only(f)]
          pin = bool(files) and not other
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"pin={'true' if pin else 'false'}\n")
          if pin:
              print("obs/deploy-agent-only push: pinning wanted now")
          elif not files:
              print("commit file list unavailable: not pinning")
          else:
              print(f"{len(other)} image-affecting file(s), e.g. {other[:5]}: "
                    "leaving the pin to the images workflow_run")
          PY

      - name: Write .deploy-state.json wanted
        if: github.event_name != 'push' || steps.gate.outputs.pin == 'true'
        env:
          MISPLEASE_ROOT: ${{ vars.MISPLEASE_ROOT }}
          DEPLOY_ALERT_WEBHOOK: ${{ secrets.DEPLOY_ALERT_WEBHOOK }}
          WANTED_SHA: ${{ github.event.inputs.sha || github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          export MISPLEASE_ROOT="${MISPLEASE_ROOT:-/home/mis/misplease}"
          python3 "${GITHUB_WORKSPACE}/tools/deploy/agent.py" set-wanted "${WANTED_SHA}"
          python3 "${GITHUB_WORKSPACE}/tools/deploy/agent.py" status
