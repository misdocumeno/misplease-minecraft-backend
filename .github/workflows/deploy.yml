# After a successful images push on main, pin wanted SHA on the host.
# The ops `deployer` container reconciles wanted → pull/up when the proxy
# has been empty (no Actions wait — no 6h job timeout on play sessions).
#
# HARD RULE: never attach pull_request / fork workflows to runs-on: [self-hosted]
# (docker.sock = root on the host). Only trusted main (via images→deploy) and
# workflow_dispatch.
name: deploy

on:
  workflow_run:
    workflows: [images]
    types: [completed]
  workflow_dispatch:
    inputs:
      sha:
        description: Git SHA to set as deploy wanted (default = this commit)
        required: false
        default: ""

concurrency:
  group: misplease-deploy-wanted
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  set-wanted:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Checkout set-wanted helper
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Write .deploy-state.json wanted
        env:
          MISPLEASE_ROOT: ${{ vars.MISPLEASE_ROOT }}
          DEPLOY_ALERT_WEBHOOK: ${{ secrets.DEPLOY_ALERT_WEBHOOK }}
          WANTED_SHA: ${{ github.event.inputs.sha || github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          export MISPLEASE_ROOT="${MISPLEASE_ROOT:-/home/mis/misplease}"
          python3 "${GITHUB_WORKSPACE}/tools/deploy/agent.py" set-wanted "${WANTED_SHA}"
          python3 "${GITHUB_WORKSPACE}/tools/deploy/agent.py" status
