# Pin wanted SHA on the host. The ops `deployer` reconciles:
#   - hot-reload.yml-only diffs → sync overlay upper + RCON (live)
#   - anything else → empty gate + compose pull/up + health
#
# Triggers (never race images):
#   - successful `images` workflow_run on main push (after build+smoke+GHCR tags)
#   - workflow_dispatch (manual pin)
#   - push that only touches deploy agent / this workflow (no image rebuild)
#
# Do NOT trigger on every main push in parallel with `images`: that pinned wanted
# before tags existed and before smoke. Failed smoke → images conclusion≠success
# → set-wanted must not run.
#
# HARD RULE: never attach pull_request / fork workflows to runs-on: [self-hosted]
# (docker.sock = root on the host). Only trusted main and workflow_dispatch.
name: deploy

on:
  workflow_run:
    workflows: [images]
    types: [completed]
  workflow_dispatch:
    inputs:
      sha:
        description: Git SHA to set as deploy wanted (default = this commit)
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - "tools/deploy/**"
      - ".github/workflows/deploy.yml"

concurrency:
  group: misplease-deploy-wanted
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  set-wanted:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Checkout set-wanted helper
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Write .deploy-state.json wanted
        env:
          MISPLEASE_ROOT: ${{ vars.MISPLEASE_ROOT }}
          DEPLOY_ALERT_WEBHOOK: ${{ secrets.DEPLOY_ALERT_WEBHOOK }}
          WANTED_SHA: ${{ github.event.inputs.sha || github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          export MISPLEASE_ROOT="${MISPLEASE_ROOT:-/home/mis/misplease}"
          python3 "${GITHUB_WORKSPACE}/tools/deploy/agent.py" set-wanted "${WANTED_SHA}"
          python3 "${GITHUB_WORKSPACE}/tools/deploy/agent.py" status
