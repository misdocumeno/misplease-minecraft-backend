# Preprod + prod: pull images from GHCR only (never build on the host).
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
# Ops sidecars (runner + deployer + restic), same file, optional profile:
#   docker compose -f docker-compose.prod.yml --profile ops up -d
# CD only touches game services (see tools/deploy); runner/deployer/backup stay up.
#
# IMAGE_TAG must be a full commit sha (set in .env; deployer pins after healthy apply).

services:
  velocity:
    image: ghcr.io/misdocumeno/misplease-minecraft-backend/velocity:${IMAGE_TAG:?set IMAGE_TAG to a commit sha}
    container_name: misplease-proxy
    init: true
    stop_grace_period: 30s
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    devices:
      - /dev/fuse
    environment:
      - KIND=proxy
      # Heap returns to the OS when idle: periodic GC + free-ratio bounds, so an
      # empty server does not keep 3 GB committed. Compact object headers (JEP
      # 519, product in JDK 25) cut ~10-20% of heap on object-heavy workloads.
      - JVM_OPTS=${VELOCITY_JVM_OPTS:--Xms256M -Xmx512M -XX:+UseCompactObjectHeaders -XX:-UseBASE64Intrinsics -XX:G1PeriodicGCInterval=300000 -XX:MinHeapFreeRatio=20 -XX:MaxHeapFreeRatio=40}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - DB_PASSWORD=${DB_PASSWORD}
      # LuckPerms reads these natively (LUCKPERMS_ + config key path); its
      # config.yml no longer carries the secrets.
      - LUCKPERMS_DATA_PASSWORD=${DB_PASSWORD}
      - LUCKPERMS_REDIS_PASSWORD=${REDIS_PASSWORD}
      - DATABASE_URL=postgres://misplease:${DB_PASSWORD}@db:5432/misplease
      - VELOCITY_FORWARDING_SECRET=${VELOCITY_FORWARDING_SECRET}
      # Velocircon: standard RCON on the compose network only (not published).
      - VELOCIRCON__ENABLE=true
      - VELOCIRCON__HOST=0.0.0.0
      - VELOCIRCON__PORT=25575
      - VELOCIRCON__PASSWORD=${RCON_PASSWORD:-}
      # Floodgate key.pem (PEM body). Same value on velocity/main/tech.
      - FLOODGATE_KEY_PEM=${FLOODGATE_KEY_PEM:-}
      - FLOODGATE_KEY_B64=${FLOODGATE_KEY_B64:-}
    volumes:
      - ./infra/velocity/config:/config:ro
      - ./infra/velocity/data:/data
    ports:
      - 25565:25577
      # Bedrock (Geyser-Velocity). UDP required; TCP helps newer Bedrock transports.
      - 19132:19132/udp
      - 19132:19132/tcp
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  main:
    image: ghcr.io/misdocumeno/misplease-minecraft-backend/main:${IMAGE_TAG:?set IMAGE_TAG to a commit sha}
    container_name: misplease-main
    init: true
    stop_grace_period: 90s
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    devices:
      - /dev/fuse
    environment:
      - KIND=server
      - SERVER_ID=main
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - DB_PASSWORD=${DB_PASSWORD}
      # LuckPerms reads these natively (LUCKPERMS_ + config key path); its
      # config.yml no longer carries the secrets.
      - LUCKPERMS_DATA_PASSWORD=${DB_PASSWORD}
      - LUCKPERMS_REDIS_PASSWORD=${REDIS_PASSWORD}
      - DATABASE_URL=postgres://misplease:${DB_PASSWORD}@db:5432/misplease
      - VELOCITY_FORWARDING_SECRET=${VELOCITY_FORWARDING_SECRET}
      - FLOODGATE_KEY_PEM=${FLOODGATE_KEY_PEM:-}
      - FLOODGATE_KEY_B64=${FLOODGATE_KEY_B64:-}
      # Default = live prod main cmdline + preferSparkPlugin. Override heaps via MAIN_JVM_OPTS.
      # Compact headers (JEP 519) + periodic GC/free ratios: less heap per object
      # and memory handed back when the server is idle.
      # -XX:-UseBASE64Intrinsics: stopgap for CVE-2026-114938 (Java4Shell, fixed in
      # 25.0.5.1+). Remove once the image reports 25.0.5.1 or newer.
      - JVM_OPTS=${MAIN_JVM_OPTS:--Xms256M -Xmx3G -XX:+UseG1GC -XX:+ParallelRefProcEnabled -XX:MaxGCPauseMillis=200 -XX:+DisableExplicitGC -XX:+UseCompactObjectHeaders -XX:G1PeriodicGCInterval=300000 -XX:MinHeapFreeRatio=20 -XX:MaxHeapFreeRatio=40 -XX:-UseBASE64Intrinsics -Dorg.maxgamer.quickshop.util.envcheck.skip.SIGNATURE_VERIFY -Dpaper.preferSparkPlugin=true --add-modules=jdk.incubator.vector}
      - RCON_PASSWORD=${RCON_PASSWORD:-}
    volumes:
      - ./infra/minecraft/main/config:/config:ro
      - ./infra/minecraft/main/data:/data
    ports:
      - 8080:25568
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  tech:
    image: ghcr.io/misdocumeno/misplease-minecraft-backend/tech:${IMAGE_TAG:?set IMAGE_TAG to a commit sha}
    container_name: misplease-tech
    init: true
    stop_grace_period: 90s
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    devices:
      - /dev/fuse
    environment:
      - KIND=server
      - SERVER_ID=tech
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - DB_PASSWORD=${DB_PASSWORD}
      # LuckPerms reads these natively (LUCKPERMS_ + config key path); its
      # config.yml no longer carries the secrets.
      - LUCKPERMS_DATA_PASSWORD=${DB_PASSWORD}
      - LUCKPERMS_REDIS_PASSWORD=${REDIS_PASSWORD}
      - DATABASE_URL=postgres://misplease:${DB_PASSWORD}@db:5432/misplease
      - VELOCITY_FORWARDING_SECRET=${VELOCITY_FORWARDING_SECRET}
      - FLOODGATE_KEY_PEM=${FLOODGATE_KEY_PEM:-}
      - FLOODGATE_KEY_B64=${FLOODGATE_KEY_B64:-}
      # Default = live prod tech cmdline + preferSparkPlugin. Override heaps via TECH_JVM_OPTS.
      - JVM_OPTS=${TECH_JVM_OPTS:--Xms256M -Xmx2G -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+UseCompactObjectHeaders -XX:G1PeriodicGCInterval=300000 -XX:MinHeapFreeRatio=20 -XX:MaxHeapFreeRatio=40 -XX:-UseBASE64Intrinsics -Dpaper.preferSparkPlugin=true}
      - RCON_PASSWORD=${RCON_PASSWORD:-}
    volumes:
      - ./infra/minecraft/tech/config:/config:ro
      - ./infra/minecraft/tech/data:/data
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  auth:
    image: ghcr.io/misdocumeno/misplease-minecraft-backend/auth:${IMAGE_TAG:?set IMAGE_TAG to a commit sha}
    container_name: misplease-auth
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgres://misplease:${DB_PASSWORD}@db:5432/misplease
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - AUTH_ADMIN_TOKEN=${AUTH_ADMIN_TOKEN:-}
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    ports:
      - 127.0.0.1:3000:3000

  # Drizzle migrator from @misplease/db (same auth image).
  db-migrate:
    image: ghcr.io/misdocumeno/misplease-minecraft-backend/auth:${IMAGE_TAG:?set IMAGE_TAG to a commit sha}
    container_name: misplease-db-migrate
    environment:
      - DATABASE_URL=postgres://misplease:${DB_PASSWORD}@db:5432/misplease
    depends_on:
      db:
        condition: service_healthy
    command: ["node", "/app/packages/db/dist/migrate.js"]

  db:
    image: postgres:18-alpine
    container_name: misplease-db
    restart: unless-stopped
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_USER=misplease
      - POSTGRES_DB=misplease
    # Bind under the stack tree (not a named volume) so rsync/restic of the repo
    # root can see DB files. Still always pg_dump in restic-loop — do not rely on
    # copying these files alone. PG18 uses /var/lib/postgresql (not …/data).
    volumes:
      - ./infra/db/data:/var/lib/postgresql
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'misplease']
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - 127.0.0.1:5432:5432

  redis:
    image: redis:8-alpine
    container_name: misplease-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly no
      --save ""
    healthcheck:
      test: redis-cli -a ${REDIS_PASSWORD} ping
      interval: 10s
      timeout: 5s
      retries: 5

  # Static host for Paper resource-pack URL (server.properties → :24256/...).
  # Zip lives under main data/state (not in git); cutover/restic keep it on the VM.
  resource-pack:
    image: nginx:stable-alpine
    container_name: misplease-resource-pack
    restart: unless-stopped
    volumes:
      - ./infra/minecraft/main/data/state/resource-pack/public:/usr/share/nginx/html:ro
    ports:
      - 24256:80

  # --- ops profile (not required to play) ---
  # Community image wrapping the official actions/runner binary (not published by GitHub).
  github-runner:
    profiles: ["ops"]
    image: myoung34/github-runner:ubuntu-noble
    container_name: misplease-gha-runner
    restart: unless-stopped
    environment:
      REPO_URL: https://github.com/misdocumeno/misplease-minecraft-backend
      RUNNER_NAME: ${GH_RUNNER_NAME:-misplease}
      RUNNER_SCOPE: repo
      # One-shot registration token from GitHub UI (keep in .env until CD is proven).
      # Reuse across recreate/restart requires BOTH env vars below + the data volume
      # (myoung34: without them it prints "Runner reusage is disabled", deletes
      # .runner/.credentials, and deregisters on EXIT — that is why we kept asking
      # for a new token).
      RUNNER_TOKEN: ${GH_RUNNER_REGISTRATION_TOKEN:-}
      ACCESS_TOKEN: ${GH_RUNNER_PAT:-}
      CONFIGURED_ACTIONS_RUNNER_FILES_DIR: /runner-files
      DISABLE_AUTOMATIC_DEREGISTRATION: "true"
      # Standard GitHub self-hosted runner label (docs: runs-on: self-hosted).
      LABELS: self-hosted
      RUNNER_WORKDIR: /tmp/runner-work
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # redis-cli (deploy wait script) needs ACL user `default`; Jedis/Lettuce accept redis://:pass@ too.
      REDIS_URL: redis://default:${REDIS_PASSWORD}@redis:6379/0
      # Same absolute path as the host — compose bind mounts are resolved by the daemon.
      MISPLEASE_ROOT: ${MISPLEASE_HOST_ROOT:-/home/mis/misplease}
      # Do not mount ~/.ssh/config (OpenSSH rejects foreign uid). Key files only.
      GIT_SSH_COMMAND: ssh -i /root/.ssh/misplease_deploy -o IdentitiesOnly=yes -o UserKnownHostsFile=/root/.ssh/known_hosts -o StrictHostKeyChecking=yes
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${MISPLEASE_HOST_ROOT:-/home/mis/misplease}:${MISPLEASE_HOST_ROOT:-/home/mis/misplease}
      - ${MISPLEASE_SSH_DIR:-/home/mis/.ssh}/misplease_deploy:/root/.ssh/misplease_deploy:ro
      - ${MISPLEASE_SSH_DIR:-/home/mis/.ssh}/known_hosts:/root/.ssh/known_hosts:ro
      # Host `docker login ghcr.io` (user mis) — pull via docker.sock uses this client config.
      - ${MISPLEASE_DOCKER_CONFIG:-/home/mis/.docker/config.json}:/root/.docker/config.json:ro
      # Only .runner/.credentials (NOT the whole /actions-runner install tree).
      - github-runner-data:/runner-files
    depends_on:
      redis:
        condition: service_healthy

  # Reconciles .deploy-state.json wanted → compose. Actions only runs set-wanted.
  # No depends_on redis: pin is a file; redis is only for presence/maintenance.
  # Recreating redis must not restart this container mid-apply.
  deployer:
    profiles: ["ops"]
    image: python:3.13-alpine
    container_name: misplease-deployer
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -c
      - >-
          apk add --no-cache bash docker-cli docker-cli-compose git openssh-client redis
          >/dev/null
          && pip install --no-cache-dir -q -r /app/requirements.txt
          && exec python -u /app/agent.py run
    environment:
      MISPLEASE_ROOT: ${MISPLEASE_HOST_ROOT:-/home/mis/misplease}
      COMPOSE_FILE: docker-compose.prod.yml
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_URL: redis://default:${REDIS_PASSWORD}@redis:6379/0
      POLL_SECONDS: ${DEPLOY_POLL_SECONDS:-15}
      EMPTY_SECONDS: ${DEPLOY_EMPTY_SECONDS:-60}
      HEALTH_TIMEOUT_S: ${DEPLOY_HEALTH_TIMEOUT_S:-180}
      DEPLOY_ALERT_WEBHOOK: ${DEPLOY_ALERT_WEBHOOK:-}
      # RCON stays unpublished (no host ports). Deployer reaches main/tech/velocity:25575 on the compose network only.
      RCON_PASSWORD: ${RCON_PASSWORD:-}
      RCON_PORT: "25575"
      GIT_SSH_COMMAND: ssh -i /root/.ssh/misplease_deploy -o IdentitiesOnly=yes -o UserKnownHostsFile=/root/.ssh/known_hosts -o StrictHostKeyChecking=yes
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${MISPLEASE_HOST_ROOT:-/home/mis/misplease}:${MISPLEASE_HOST_ROOT:-/home/mis/misplease}
      - ./tools/deploy:/app:ro
      - ${MISPLEASE_SSH_DIR:-/home/mis/.ssh}/misplease_deploy:/root/.ssh/misplease_deploy:ro
      - ${MISPLEASE_SSH_DIR:-/home/mis/.ssh}/known_hosts:/root/.ssh/known_hosts:ro
      - ${MISPLEASE_DOCKER_CONFIG:-/home/mis/.docker/config.json}:/root/.docker/config.json:ro

  # Freezes an idle backend and pushes its pages out of RAM (`tools/hibernate`).
  # Root + `/sys/fs/cgroup` rw is required: `memory.reclaim` is root-only, and
  # this container already has docker.sock, so it is the same trust level as the
  # deployer. DRY_RUN defaults to 1: it only logs until the stack is happy.
  hibernate:
    profiles: ["ops"]
    image: python:3.13-alpine
    container_name: misplease-hibernate
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -c
      - >-
          apk add --no-cache docker-cli redis >/dev/null
          && pip install --no-cache-dir -q mcrcon
          && exec python -u /app/agent.py
    environment:
      MISPLEASE_ROOT: ${MISPLEASE_HOST_ROOT:-/home/mis/misplease}
      REDIS_URL: redis://default:${REDIS_PASSWORD}@redis:6379/0
      RCON_PASSWORD: ${RCON_PASSWORD:-}
      RCON_PORT: "25575"
      HIBERNATE_SERVERS: ${HIBERNATE_SERVERS:-main,tech}
      HIBERNATE_AFTER_SECONDS: ${HIBERNATE_AFTER_SECONDS:-600}
      HIBERNATE_RECLAIM_STEP_MB: ${HIBERNATE_RECLAIM_STEP_MB:-512}
      HIBERNATE_RECLAIM_FLOOR_MB: ${HIBERNATE_RECLAIM_FLOOR_MB:-192}
      # Freeze-aware watchdog: RCON `list` on awake servers. Alerts first, and
      # restarts the container only if it stays stuck.
      HIBERNATE_PROBE_SECONDS: ${HIBERNATE_PROBE_SECONDS:-30}
      HIBERNATE_HANG_ALERT_AFTER: ${HIBERNATE_HANG_ALERT_AFTER:-3}
      HIBERNATE_HANG_RESTART_AFTER: ${HIBERNATE_HANG_RESTART_AFTER:-6}
      DEPLOY_ALERT_WEBHOOK: ${DEPLOY_ALERT_WEBHOOK:-}
      HIBERNATE_DRY_RUN: ${HIBERNATE_DRY_RUN:-1}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Host cgroup v2 (systemd scope per container), writable for memory.reclaim.
      - /sys/fs/cgroup:/sys/fs/cgroup
      - ${MISPLEASE_HOST_ROOT:-/home/mis/misplease}:${MISPLEASE_HOST_ROOT:-/home/mis/misplease}
      - ./tools/hibernate:/app:ro
    depends_on:
      redis:
        condition: service_healthy

  backup:
    profiles: ["ops"]
    image: restic/restic:0.20
    container_name: misplease-backup
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c", "apk add --no-cache docker-cli docker-cli-compose >/dev/null && exec /bin/sh /scripts/restic-loop.sh"]
    environment:
      # Optional until restic is wired; backup entrypoint should no-op if unset.
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:-}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:-}
      # Wall-clock UTC (not "N hours after container start"). Default 06:00 UTC.
      BACKUP_AT_HOUR: ${BACKUP_AT_HOUR:-6}
      BACKUP_AT_MINUTE: ${BACKUP_AT_MINUTE:-0}
      MISPLEASE_ROOT: ${MISPLEASE_HOST_ROOT:-/home/mis/misplease}
      COMPOSE_FILE: docker-compose.prod.yml
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${MISPLEASE_HOST_ROOT:-/home/mis/misplease}:${MISPLEASE_HOST_ROOT:-/home/mis/misplease}:ro
      - ${MISPLEASE_HOST_ROOT:-/home/mis/misplease}/infra:/data/infra:ro
      - ./tools/backup/restic-loop.sh:/scripts/restic-loop.sh:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  github-runner-data:
