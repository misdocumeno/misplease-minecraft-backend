# Preprod + prod: pull images from GHCR only (never build on the host).
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
# Ops sidecars (runner + restic), same file, optional profile:
#   docker compose -f docker-compose.prod.yml --profile ops up -d
# CD only touches game services (see tools/deploy); runner/backup stay up.
#
# IMAGE_TAG defaults to `dev` (what images.yml pushes on main). Pin to a sha for rollbacks.

services:
  velocity:
    image: ghcr.io/misdocumeno/misplease-minecraft-backend/velocity:${IMAGE_TAG:-dev}
    container_name: misplease-proxy
    init: true
    stop_grace_period: 30s
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    devices:
      - /dev/fuse
    environment:
      - KIND=proxy
      - JVM_OPTS=${VELOCITY_JVM_OPTS:--Xms256M -Xmx512M}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - DB_PASSWORD=${DB_PASSWORD}
      - DATABASE_URL=postgres://misplease:${DB_PASSWORD}@db:5432/misplease
    volumes:
      - ./infra/velocity/config:/config:ro
      - ./infra/velocity/data:/data
    ports:
      - 25565:25577
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  main:
    image: ghcr.io/misdocumeno/misplease-minecraft-backend/main:${IMAGE_TAG:-dev}
    container_name: misplease-main
    init: true
    stop_grace_period: 90s
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    devices:
      - /dev/fuse
    environment:
      - KIND=server
      - SERVER_ID=main
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - DB_PASSWORD=${DB_PASSWORD}
      - DATABASE_URL=postgres://misplease:${DB_PASSWORD}@db:5432/misplease
      - JVM_OPTS=${MAIN_JVM_OPTS:--Xms1G -Xmx5G -XX:+UseG1GC -XX:+ParallelRefProcEnabled -XX:MaxGCPauseMillis=200 -XX:+DisableExplicitGC -Dorg.maxgamer.quickshop.util.envcheck.skip.SIGNATURE_VERIFY -Dpaper.preferSparkPlugin=true --add-modules=jdk.incubator.vector}
      - RCON_PASSWORD=${RCON_PASSWORD:-}
    volumes:
      - ./infra/minecraft/main/config:/config:ro
      - ./infra/minecraft/main/data:/data
    ports:
      - 8080:25568
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  tech:
    image: ghcr.io/misdocumeno/misplease-minecraft-backend/tech:${IMAGE_TAG:-dev}
    container_name: misplease-tech
    init: true
    stop_grace_period: 90s
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    devices:
      - /dev/fuse
    environment:
      - KIND=server
      - SERVER_ID=tech
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - DB_PASSWORD=${DB_PASSWORD}
      - DATABASE_URL=postgres://misplease:${DB_PASSWORD}@db:5432/misplease
      - JVM_OPTS=${TECH_JVM_OPTS:--Xms512M -Xmx4G -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -Dpaper.preferSparkPlugin=true}
      - RCON_PASSWORD=${RCON_PASSWORD:-}
    volumes:
      - ./infra/minecraft/tech/config:/config:ro
      - ./infra/minecraft/tech/data:/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  auth:
    image: ghcr.io/misdocumeno/misplease-minecraft-backend/auth:${IMAGE_TAG:-dev}
    container_name: misplease-auth
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgres://misplease:${DB_PASSWORD}@db:5432/misplease
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - AUTH_ADMIN_TOKEN=${AUTH_ADMIN_TOKEN:-}
    depends_on:
      auth-db-migrate:
        condition: service_completed_successfully
    ports:
      - 127.0.0.1:3000:3000

  auth-db-migrate:
    image: ghcr.io/misdocumeno/misplease-minecraft-backend/auth:${IMAGE_TAG:-dev}
    container_name: misplease-auth-migrate
    environment:
      - DATABASE_URL=postgres://misplease:${DB_PASSWORD}@db:5432/misplease
    volumes:
      - ./services/auth/drizzle:/app/drizzle
    depends_on:
      db:
        condition: service_healthy
    command: node /app/dist/migrate.js

  db:
    image: postgres:18-alpine
    container_name: misplease-db
    restart: unless-stopped
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_USER=misplease
      - POSTGRES_DB=misplease
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'misplease']
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - 127.0.0.1:5432:5432

  redis:
    image: redis:8.10-alpine
    container_name: misplease-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly no
      --save ""
    healthcheck:
      test: redis-cli -a ${REDIS_PASSWORD} ping
      interval: 10s
      timeout: 5s
      retries: 5

  # --- ops profile (not required to play) ---
  # Community image wrapping the official actions/runner binary (not published by GitHub).
  github-runner:
    profiles: ["ops"]
    image: myoung34/github-runner:ubuntu-noble
    container_name: misplease-gha-runner
    restart: unless-stopped
    environment:
      REPO_URL: https://github.com/misdocumeno/misplease-minecraft-backend
      RUNNER_NAME: ${GH_RUNNER_NAME:-misplease}
      RUNNER_SCOPE: repo
      # One-shot registration token from GitHub UI (keep in .env until CD is proven).
      # Reuse across recreate/restart requires BOTH env vars below + the data volume
      # (myoung34: without them it prints "Runner reusage is disabled", deletes
      # .runner/.credentials, and deregisters on EXIT — that is why we kept asking
      # for a new token).
      RUNNER_TOKEN: ${GH_RUNNER_REGISTRATION_TOKEN:-}
      ACCESS_TOKEN: ${GH_RUNNER_PAT:-}
      CONFIGURED_ACTIONS_RUNNER_FILES_DIR: /runner-files
      DISABLE_AUTOMATIC_DEREGISTRATION: "true"
      # Standard GitHub self-hosted runner label (docs: runs-on: self-hosted).
      LABELS: self-hosted
      RUNNER_WORKDIR: /tmp/runner-work
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # redis-cli (deploy wait script) needs ACL user `default`; Jedis/Lettuce accept redis://:pass@ too.
      REDIS_URL: redis://default:${REDIS_PASSWORD}@redis:6379/0
      # Same absolute path as the host — compose bind mounts are resolved by the daemon.
      MISPLEASE_ROOT: ${MISPLEASE_HOST_ROOT:-/home/mis/misplease}
      # Do not mount ~/.ssh/config (OpenSSH rejects foreign uid). Key files only.
      GIT_SSH_COMMAND: ssh -i /root/.ssh/misplease_deploy -o IdentitiesOnly=yes -o UserKnownHostsFile=/root/.ssh/known_hosts -o StrictHostKeyChecking=yes
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${MISPLEASE_HOST_ROOT:-/home/mis/misplease}:${MISPLEASE_HOST_ROOT:-/home/mis/misplease}
      - ${MISPLEASE_SSH_DIR:-/home/mis/.ssh}/misplease_deploy:/root/.ssh/misplease_deploy:ro
      - ${MISPLEASE_SSH_DIR:-/home/mis/.ssh}/known_hosts:/root/.ssh/known_hosts:ro
      # Host `docker login ghcr.io` (user mis) — pull via docker.sock uses this client config.
      - ${MISPLEASE_DOCKER_CONFIG:-/home/mis/.docker/config.json}:/root/.docker/config.json:ro
      # Only .runner/.credentials (NOT the whole /actions-runner install tree).
      - github-runner-data:/runner-files
    depends_on:
      redis:
        condition: service_healthy

  backup:
    profiles: ["ops"]
    image: restic/restic:0.18.0
    container_name: misplease-backup
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c", "apk add --no-cache docker-cli docker-cli-compose >/dev/null && exec /bin/sh /scripts/restic-loop.sh"]
    environment:
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:?}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:?}
      # Wall-clock UTC (not "N hours after container start"). Default 06:00 UTC.
      BACKUP_AT_HOUR: ${BACKUP_AT_HOUR:-6}
      BACKUP_AT_MINUTE: ${BACKUP_AT_MINUTE:-0}
      MISPLEASE_ROOT: ${MISPLEASE_HOST_ROOT:-/home/mis/misplease}
      COMPOSE_FILE: docker-compose.prod.yml
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${MISPLEASE_HOST_ROOT:-/home/mis/misplease}:${MISPLEASE_HOST_ROOT:-/home/mis/misplease}:ro
      - ${MISPLEASE_HOST_ROOT:-/home/mis/misplease}/infra:/data/infra:ro
      - ./tools/backup/restic-loop.sh:/scripts/restic-loop.sh:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
  github-runner-data:
