# Desired set only. Versions live in plugins-lock.yml (Paper 26.3 stack).
minecraft: "26.3"
server:
  source: papermc
  id: paper
  version: "26.3"

plugins:
  - name: DecentHolograms
    source: modrinth
    slug: decentholograms
  - name: EssentialsX
    source: github
    repo: EssentialsX/Essentials
    jar: /^EssentialsX-[0-9]/
  - name: FastAsyncWorldEdit
    source: modrinth
    slug: fastasyncworldedit
  - name: LuckPerms
    source: modrinth
    slug: luckperms
  # 7.0.21+ needs WorldEdit YAMLProcessor(Path) that FAWE 2.16.2 does not ship; 7.0.18 supports 26.3.
  - name: WorldGuard
    source: modrinth
    slug: worldguard
    version: "7.0.18"
  - name: GriefPrevention
    source: modrinth
    slug: griefprevention
