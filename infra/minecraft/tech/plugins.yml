# Desired set only. Versions live in plugins-lock.yml.
# server.version = Paper *line*; builds float on `plugin-lock update`. Also feeds source:git JVM/bytecode hints.
server:
  source: papermc
  id: paper
  version: "26.3"

plugins:
  - name: ActionHealth
    source: github
    repo: zeshan321/ActionHealth
  - name: DeathCoordinates
    source: spiget
    id: "43318"
  - name: EssentialsX
    source: github
    repo: EssentialsX/Essentials
    jar: /^EssentialsX-[0-9]/
  - name: FastAsyncWorldEdit
    source: modrinth
    slug: fastasyncworldedit
  - name: LuckPerms
    source: modrinth
    slug: luckperms
  # Inventory/stats ownership per world group (same API OpenInv uses on main).
  # One group with all three worlds: dimension changes must not swap inventories.
  - name: Multiverse-Core
    source: modrinth
    slug: multiverse-core
  - name: Multiverse-Inventories
    source: modrinth
    slug: multiverse-inventories
  # 7.0.21+ needs WorldEdit YAMLProcessor(Path) that FAWE 2.16.2 does not ship; 7.0.18 supports 26.3.
  - name: WorldGuard
    source: modrinth
    slug: worldguard
    version: "7.0.18"
  - name: WorldGamerules
    source: github
    repo: misdocumeno/WorldGamerules
    version: v0.1.5
  - name: GriefPrevention
    source: modrinth
    slug: griefprevention
  - name: BetterWarps
    source: github
    repo: misdocumeno/BetterWarps
    version: v0.1.3
  # Same jar on Velocity + backends; proxy owns /skin + storage (global).
  - name: SkinsRestorer
    source: modrinth
    slug: skinsrestorer
  # Via* on backends (not Velocity). VV = older clients; VB = newer clients than this Paper.
  - name: ViaVersion
    source: modrinth
    slug: viaversion
  - name: ViaBackwards
    source: modrinth
    slug: viabackwards
  - name: Floodgate
    source: geysermc
    id: floodgate
    asset: spigot
  # Diagnostics: event log to find out why a tracked entity disappears. Off by default.
  - name: EntityWatch
    source: github
    repo: misdocumeno/EntityWatch
    version: v0.1.1
