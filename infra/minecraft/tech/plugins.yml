# Desired set only. Versions live in plugins-lock.yml (Paper 26.3 stack).
server:
  source: papermc
  id: paper

plugins:
  - name: DecentHolograms
    source: modrinth
    slug: decentholograms
  - name: EssentialsX
    source: github
    repo: EssentialsX/Essentials
    jar: /^EssentialsX-[0-9]/
  - name: FastAsyncWorldEdit
    source: modrinth
    slug: fastasyncworldedit
  - name: LuckPerms
    source: modrinth
    slug: luckperms
  # 7.0.21+ needs a YAMLProcessor(Path,…) WorldEdit API that FAWE 2.16.2 does not ship yet.
  - name: WorldGuard
    source: modrinth
    slug: worldguard
    version: "7.0.18"
  - name: GriefPrevention
    source: modrinth
    slug: griefprevention
