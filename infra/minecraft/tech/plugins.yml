# Desired set only. Versions live in plugins-lock.yml.
# server.version = Paper *line*; builds float on `plugin-lock update`. Also feeds source:git JVM/bytecode hints.
server:
  source: papermc
  id: paper
  version: "26.3"

plugins:
  - name: ActionHealth
    source: github
    repo: zeshan321/ActionHealth
  - name: DeathCoordinates
    source: spiget
    id: "43318"
  - name: EssentialsX
    source: github
    repo: EssentialsX/Essentials
    jar: /^EssentialsX-[0-9]/
  - name: FastAsyncWorldEdit
    source: modrinth
    slug: fastasyncworldedit
  - name: LuckPerms
    source: modrinth
    slug: luckperms
  # 7.0.21+ needs WorldEdit YAMLProcessor(Path) that FAWE 2.16.2 does not ship; 7.0.18 supports 26.3.
  - name: WorldGuard
    source: modrinth
    slug: worldguard
    version: "7.0.18"
  - name: GriefPrevention
    source: modrinth
    slug: griefprevention
  - name: OpenInv
    source: github
    repo: misdocumeno/OpenInv
    version: v0.1.0
  - name: BetterWarps
    source: github
    repo: misdocumeno/BetterWarps
    version: v0.1.1
  # Same jar on Velocity + backends; proxy owns /skin + storage (global).
  - name: SkinsRestorer
    source: modrinth
    slug: skinsrestorer
  # Via* on backends (not Velocity). VV = older clients; VB = newer clients than this Paper.
  - name: ViaVersion
    source: modrinth
    slug: viaversion
  - name: ViaBackwards
    source: modrinth
    slug: viabackwards
