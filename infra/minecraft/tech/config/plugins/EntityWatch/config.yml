# Diagnostic switch. It was on to explain iron-farm villagers disappearing;
# that turned out to be the witch/lightning-rod issue, so it listens to nothing
# now. Turn it back on (entity-types: [VILLAGER]) only to chase a new loss.
enabled: false

# Every villager on this server. Narrow with `uuids:` once we know the farm ones.
entity-types:
  - VILLAGER

uuids: []

worlds: []

events:
  damage: true
  death: true
  transform: true
  remove: true
  explode: true
  chunk: true

history-lines: 40
context-radius: 12
console-alert: true
