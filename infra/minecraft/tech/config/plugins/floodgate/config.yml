# Same key.pem as Velocity Floodgate (FLOODGATE_KEY_PEM).
key-file-name: key.pem
username-prefix: "."
replace-spaces: true

disconnect:
  invalid-key: Please connect through the official Geyser
  invalid-arguments-length: Expected {} arguments, got {}. Is Geyser up-to-date?

# Linking DB lives on Velocity only. Backends keep Floodgate for skins/API.
player-link:
  enabled: true
  require-link: false
  enable-own-linking: false
  allowed: true
  link-code-timeout: 300
  type: sqlite
  enable-global-linking: false

metrics:
  enabled: false

config-version: 3
