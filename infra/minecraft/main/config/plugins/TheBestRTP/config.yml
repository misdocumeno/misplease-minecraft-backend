        - GRASS_BLOCK
        - COARSE_DIRT
        - PODZOL
        - SAND
        - RED_SAND
        - TERRACOTTA
        - SNOW
        - SNOW_BLOCK
        - PACKED_ICE
        - ICE
    recursos2:
        - GRASS_BLOCK
        - COARSE_DIRT
        - PODZOL
        - SAND
        - RED_SAND
        - TERRACOTTA
        - SNOW
        - SNOW_BLOCK
        - PACKED_ICE
        - ICE
    recursos_custom:
        - GRASS_BLOCK
        - COARSE_DIRT
        - PODZOL
        - SAND
        - RED_SAND
        - TERRACOTTA
        - SNOW
        - SNOW_BLOCK
        - PACKED_ICE
        - ICE
    nether:
        - NETHERRACK
        - NETHER_BRICKS
        - GRAVEL
        - SOUL_SAND
        - SOUL_SOIL
        - CRIMSON_NYLIUM
        - WARPED_NYLIUM
        - BLACKSTONE
        - BASALT
        - NETHER_QUARTZ_ORE
        - NETHER_GOLD_ORE
    nether_noreset:
        - NETHERRACK
        - NETHER_BRICKS
        - GRAVEL
        - SOUL_SAND
        - SOUL_SOIL
        - CRIMSON_NYLIUM
        - WARPED_NYLIUM
        - BLACKSTONE
        - BASALT
        - NETHER_QUARTZ_ORE
        - NETHER_GOLD_ORE
    end:
        - END_STONE
    world_the_end_noreset:
        - END_STONE

# if a world doesn't have a specified region
# it will use this default limit
default:
    1:
        x: -30000
        z: -30000
    2:
        x: 30000
        z: 30000

# if a world doesn't have specific spawn blocks
# it will use these default blocks
rtp-blocks-default:
    - GRASS_BLOCK
    - COARSE_DIRT
    - PODZOL
    - SAND
    - RED_SAND
    - TERRACOTTA
    - SNOW
    - SNOW_BLOCK
    - PACKED_ICE
    - ICE
    - NETHERRACK
    - NETHER_BRICKS
    - GRAVEL
    - SOUL_SAND
    - SOUL_SOIL
    - CRIMSON_NYLIUM
    - WARPED_NYLIUM
    - BLACKSTONE
    - BASALT
    - NETHER_QUARTZ_ORE
    - NETHER_GOLD_ORE
    - END_STONE

# players will not be able to rtp to these worlds
forbidden-worlds:
    - forbiden_world
    - secret_world

# how many locations per world should be precalculated?
# so when the player uses the /rtp command, we can teleport it as fast as possible!
cache-size: 20
# when the rtp cache is empty, new random locations will be calculated, this is the delay between each calculation (in seconds)
# (if a player needs a rtp location before this timer gets one, a new one will be calculated instantly, so don't worry about big delays)
rtp-location-delay: 3
# every time the cache is emptied, new rtp locations will be calculated, but, they can also be calculated every once in a while
# how often do you want the cache to be filled? (the timer above will be used, they will not be calculated instantly all at once)
rtp-locations-calculation-timer: 600
# default teleport delay
teleport-delay: 3
# calculate rtp locations in worlds not listed in the 'worlds' list?
calculate-unspecified-worlds: false

