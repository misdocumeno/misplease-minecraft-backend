        1:
            x: -2000000
            z: -2000000
        2:
            x: 2000000
            z: 2000000
    recursos2:
        1:
            x: -2000000
            z: -2000000
        2:
            x: 2000000
            z: 2000000
    recursos_custom:
        1:
            x: 1500
            z: 1500
        2:
            x: 4500
            z: 4500
    nether:
        1:
            x: -2000000
            z: -2000000
        2:
            x: 2000000
            z: 2000000
    nether_noreset:
        1:
            x: -2000000
            z: -2000000
        2:
            x: 2000000
            z: 2000000
    end:
        1:
            x: -2000000
            z: -2000000
        2:
            x: 2000000
            z: 2000000
    world_the_end_noreset:
        1:
            x: -2000000
            z: -2000000
        2:
            x: 2000000
            z: 2000000

# the valid blocks for rtp in each world
