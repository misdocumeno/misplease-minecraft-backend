#################################
##  PlayMoreSounds Configuration
##  v3.0.0-SNAPSHOT
#################################

# Config version. Please don't change.
Version: 3.0.0

# Auto restore old configurations.
# Configurations with versions below 3.0.0 will automatically
#restore due to the amount of changes.
AutoRestore: false

# Enables debug.
DebugOutput: false

# Enables the sounds of a person who has disabled their
#sounds before leaving.
EnableSoundsAfterRelog: false

# Make the server stop sending messages for a while so you can read them.
EnableSystemWaiting: true

# Hide a sound when the triggerer have any of these
#conditions.
HidePublicSoundsWhen:
  # When one player can't see the other through the most used
  #code in vanish plugins.
  CantSee: true
  # When the player is on any of these specific gamemodes.
  Gamemode:
    Enabled: true
    Gamemodes: [ADVENTURE, SPECTATOR]
  # When a player drinks an invisibility potion.
  InvisibilityEffect:
    Enabled: true
    # Hides only when the player has the following permission:
    OnlyWithPermission:
      Enabled: true
      Permission: 'playmoresounds.radius.bypass.invisibility'

# Available languages: (en-US, es-LA, pt-BR)
Language: es-LA

# Settings of the command /pms list.
ListCommand:
  MaxValuesPerPage: 15
  PrimaryColor: '&7'
  SecondaryColor: '&e'
  Separator: ','

# If true, every player that hears a sound will have a scheduler
#just for him. If false, there will be one scheduler per sound
#played and a loop to all players that will hear.
# Also, if false, a double checking will be done to see if the
#player is allowed to hear.
SeveralRunnables: false

# Shows messages that a new file has been generated at Error
#Report folder.
ShowNewErrorReportLogMessage: true

# Settings of playmoresounds's sound regions.
SoundRegions:
  WandTool:
    Glowing: true
    Material: 'STICK'
    Name: '&6&l&nPMS Region Wand'

# Update Scheduler configuration.
Updater:
  Enabled: true
  # Shows the check status to console.
  LogToConsole: false
  # How much it should wait until the next checkage.
  # h = hour, m = minute, s = second.
  Period: 2h

# The worlds that will not play any sounds.
# To use it, just remove the "#" hashtags.
#World-BlackList:
#- 'sample'
#- 'sample_nether'