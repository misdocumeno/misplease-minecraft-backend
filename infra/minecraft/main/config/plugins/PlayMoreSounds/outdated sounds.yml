# Set a sound to play when a player triggers an event.
#
# Here you can set sounds to play when a event is triggered or create a
# sound to play with a command in-game.
#
# To set a sound to be played by command, create a section with any name and
# add the sound options. In-game, execute the following command:
# /playmoresounds play Config.SECTION_NAME_HERE
# as SECTION_NAME_HERE is the name of the section you created.
#
# To set a sound to be played when a player triggers a event, create a
# section with the name of the event and add the sound options.
# Available PMS events: [BedEnter, BedLeave, ChangeHotbar, ChangeLevel,
# CraftingExtract, FirstJoin, FurnaceExtract, GameModeChange,
# InventoryClick, JoinServer, LeaveServer, PlayerBanned, PlayerChat,
# PlayerCommand, PlayerDeath, PlayerDrop, PlayerFlight, PlayerFlightStop
# PlayerJump, PlayerKicked, PlayerTeleport, RegionEnter, RegionLeave].
#
# -> Event and multiple sound sample:
#
#PlayerTeleport: # The event that when triggered a sound will be played.
#  # Cancellable stops the sound from playing when another plugin cancels
#  #the event. This boolean helps events to be compatible with other
#  #plugins.
#  Cancellable: true
#  # Tell if a sound should be played or not. In sounds.yml case, this
#  #boolean helps with the server performance.
#  Enabled: true
#  # This is the interval list. If you want to play a sound a little after
#  #the event trigger, just specify the time in ticks here. (You can add
#  #multiple sounds by creating other timing sections.)
#  Sounds:
#    # In this case, the sound will play immediately after the event is
#    #triggered. Remember that 20 ticks = 1 second.
#    '0':
#      # Sounds can have multiple options, the only one that is required
#      #to be in every sound is Radius.
#      Options:
#        # Even if a player has toggled it's sounds to off, the sound will
#        #be played.
#        IgnoreToggle: true
#        # You can say if you want the player's EYE location or DEFAULT.
#        #Remember that EYE location changes when crouching.
#        Location: EYE
#        # The sound will be only listened by who have this permission.
#        PermissionListen: 'pms.listen.playerteleport'
#        # The sound will be only played to who have this permission.
#        PermissionRequired: 'pms.reproduce.playerteleport'
#        # Set how blocks far the sound will be listenable by players.
#        # To play to everyone in the server, set to -1. To play to
#        #everyone in the world of the player, set to -2. To play to the
#        #player itself, set to 0. To play to players around the player, set
#        #a value greater than 0.
#        Radius:
#          Range: '15.2'
#        # You can specify in blocks the location of the sound. The sound
#        #can be played to player's Front, Back, Right, Left, Up and Down.
#        #It's not necessary to add the ones that you wont use.
#        SoundPosition:
#          Front: '1.3'
#          Back: '0.1'
#          Right: '0.8'
#          Left: '4.2'
#          Up: '0.13'
#          Down: '1.0'
#      # Set how pitchy the sound will be. Values greater than 2 don't have
#      #any difference.
#      Pitch: '1.0'
#      # Here you can add a PMSSound or a sound modifier (check below).
#      # Check PMSSound on https://www.spigotmc.org/resources/37429/
#      #PMSSounds are not the same thing as bukkit sounds and sounds can be
#      #available or not depending on your version.
#      Sound: 'BLOCK_NOTE_BLOCK_PLING'
#      # Minecraft volume is the distance the sound can be heard. For the
#      #trigger player, volume has only effect when the value is lower than 0.
#      #For near players, volume 1 = 15 blocks.
#      # Volumes may or may not be available depending on your sound modifier.
#      Volume: '0.7'
#
# -> Sound modifiers:
#
# Currently, there are only two modifiers in the raw plugin, but more can be
# added by addons on PMS-Standard.
# These two are:
#
# Resource:
# Plays a resourcepack sound. You can use this modifier by setting "Sound" to
# 'Resource.RESOURCE_SOUND_HERE' as RESOURCE_SOUND_HERE is the name of the
# sound in your resourcepack.
#
# Note:
# Plays a noteblock note. You can use this modifier by setting "Sound" to
# 'Note.INSTRUMENT;NOTE' as INSTRUMENT is the instrument of the noteblock and
# NOTE is how toned the noteblock is. Remember, notes can go from 0 to 24.

# Config version. Please don't change.
Version: 3.0.0

BedEnter:
  Cancellable: true
  Enabled: false
  Sounds:
    '0':
      Options:
        PermissionRequired: 'playmoresounds.event.bedenter'
        Radius:
