
#  Specify an item and select the sound that should
# play when a player hits a mob with this item in
# his hand.
#
#  See the name of all items:
# https://hub.spigotmc.org/javadocs/spigot/org/bukkit/Material.html
#  Items may change names or be removed through
# versions, so if you aren't on the latest version
# of MC, google the name of items of your version.
#
#  Specify the name of the item or use ALL to get
# all items, Contains=NAME to get all items that
# contains that name, Ends=NAME to get all items
# that ends with this name and Starts=NAME to get
# all items that starts with this name.
#
#  You can use a bracket to specify all items that
# are exceptions to this ALL/Contains/Ends/Starts
# sorter. You can use the sorter inside these
# brackets too, however, you may not use other
# brackets to create exceptions to sorters that are
# inside other brackets, so there wont be a
# bracket-seption.
#
#  If you want more than one item to play the same
# sound, use a comma. However, if you're using a
# sorter, use the comma after the bracket exception
# list, so the bracket exception list sticks on the
# side of the sorter. Also, you can use commas
# inside bracket exception lists too.
#
#  Damager and Victim criteria: Set Damager to the
# name of the entity that should hit the victim,
# and Victim to the name of the victim that will be
# damaged by the Damager, so this event will only
# be triggered when this specific damager hits this
# specific victim with the specified items on hand.
#  If you don't want to add this criteria, just
# don't add this option to the sound.
#
#  See the name of all entities:
# https://hub.spigotmc.org/javadocs/spigot/org/bukkit/entity/EntityType.html
#  Entities may change names or be removed through
# versions, so if you aren't on the latest version
# of MC, google the name of entities of your version.
#
# Ex: When a Player holding an item that starts with
# DIAMOND or an item that ends with the name SWORD
# and that's not GOLDEN_SWORD and not STONE_SWORD
# hits a zombie:
#
#Ends=SWORD[GOLDEN_SWORD, STONE_SWORD], Starts=DIAMOND:
#  Damager: PLAYER
#  Victim: ZOMBIE
#  #Play sound on the location of DAMAGER or VICTIM
#  Location: DAMAGER
#  Sounds:
#    '0':
#      Options:
#        Radius:
#          Range: 3
#      Sound: BLOCK_ANVIL_LAND
#      Pitch: 1.5
#      Volume: 0.4
#
# More information about sounds on sounds.yml