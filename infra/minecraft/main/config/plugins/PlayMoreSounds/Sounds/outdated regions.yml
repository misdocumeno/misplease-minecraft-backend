# Set a sound to play when you enter, exit or stand on a specific region.
#
# Sample:
# (Take a note that this is a sample and the sounds may not be available
# on your MC version.)
#
#PlayMoreSounds: = The region plugin.
#  Spawn: = The region name.
#    Enter: = When a player enters this region.
#      Cancellable: true
#      Enabled: true
#      Sounds:
#        '0':
#          Options:
#            Radius:
#              Range: 0
#          Pitch: 1
#          Sound: BLOCK_NOTE_BLOCK_PLING
#          Volume: 10
#    Leave: = When a player exits this region.
#      Cancellable: true
#      Enabled: true
#      Sounds:
#        '0':
#          Options:
#            Radius:
#              Range: 0
#          Pitch: 1
#          Sound: BLOCK_NOTE_BLOCK_BASS
#          Volume: 10
#    Loop: = When a player enters the region, a loop will be triggered and play.
#      Cancellable: true
#      Delay: 0 = Time in ticks to wait to start the loop once triggered.
#      Enabled: true
#      Period: 100 = Time in ticks to wait before playing these sounds again.
#      Sounds:
#        '0':
#          Options:
#            Radius:
#              Range: 0
#          Pitch: 1
#          Sound: BLOCK_NOTE_BLOCK_BASS
#          Volume: 10
#
# You can create regions only by the native region system of PMS. To use
# other plugin's regions, use PMS Standard.
#
# More information about sounds on sounds.yml.