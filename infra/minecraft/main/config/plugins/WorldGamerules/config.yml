  spawn_nether: {}
  nether: {}
  nether_noreset: {}
  spawn_the_end: {}
  world_the_end_noreset:
    tntExplodes: false
  end: {}
  spawn_overworld: {}
  survival:
    mobGriefing: true
  SuperiorWorld:
