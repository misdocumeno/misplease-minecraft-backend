# Applied on enable and whenever a world loads.
# Merge: defaults → aliases.<alias> → worlds.<world> (world wins).
# defaults apply to every loaded world; excludes skips a world entirely.
# Paper/Bukkit gamerules are camelCase (doMobSpawning). snake_case is accepted
# and normalized by the plugin; spawn_phantoms → doInsomnia.
defaults:
  doMobSpawning: false
  mobGriefing: false
  doInsomnia: false
  doFireTick: false
  tntExplodes: false
  keepInventory: true
  sendCommandFeedback: false

aliases:
  survival:
    doMobSpawning: true
    mobGriefing: true
    doInsomnia: true
    doFireTick: true
    tntExplodes: true

excludes: []

worlds:
  survival:
    alias: survival
  recursos2:
    alias: survival
  recursos_custom:
    alias: survival
  nether:
    alias: survival
  nether_noreset:
    alias: survival
  end:
    alias: survival
  world_the_end_noreset:
    alias: survival
