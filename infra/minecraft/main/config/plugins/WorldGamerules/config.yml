# Applied on enable and whenever a world loads.
# Merge: defaults → aliases.<alias> → worlds.<world> (world wins).
# defaults apply to every loaded world; excludes skips a world entirely.
# worlds.<name> only for alias / overrides (hubs with defaults alone need no entry).
defaults:
  do_mob_spawning: false
  mob_griefing: false
  spawn_phantoms: false
  do_fire_tick: false
  tnt_explodes: false
  keep_inventory: true
  send_command_feedback: false

aliases:
  survival:
    do_mob_spawning: true
    mob_griefing: true
    spawn_phantoms: true
    do_fire_tick: true
    tnt_explodes: true

excludes: []

worlds:
  survival:
    alias: survival
  recursos2:
    alias: survival
  recursos_custom:
    alias: survival
  nether:
    alias: survival
  nether_noreset:
    alias: survival
  end:
    alias: survival
  world_the_end_noreset:
    alias: survival
