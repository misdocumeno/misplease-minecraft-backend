# Applied on enable and whenever a world loads.
# Merge: defaults → aliases.<alias> → worlds.<world> (world wins).
# worlds listed → only those worlds; empty/missing worlds → defaults on every world.
# worlds.<name>: alias: <alias>  — or a bare string meaning only that alias.
defaults:
  do_mob_spawning: false
  mob_griefing: false
  spawn_phantoms: false
  do_fire_tick: false
  tnt_explodes: false
  keep_inventory: true
  send_command_feedback: false

aliases:
  survival:
    do_mob_spawning: true
    mob_griefing: true
    spawn_phantoms: true
    do_fire_tick: true
    tnt_explodes: true

worlds:
  # hubs / city — defaults only
  world: {}
  world2: {}
  newspawn: {}
  spawn_recursos2: {}
  spawn_nether: {}
  spawn_the_end: {}
  spawn_overworld: {}
  SuperiorWorld: {}
  # gameplay survival
  survival:
    alias: survival
  recursos2:
    alias: survival
  recursos_custom:
    alias: survival
  nether:
    alias: survival
  nether_noreset:
    alias: survival
  end:
    alias: survival
  world_the_end_noreset:
    alias: survival
