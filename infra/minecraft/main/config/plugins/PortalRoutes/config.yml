# Matches legacy NetherPortal: overworld portals → spawn_nether hub (not temporal nether).
portal-types:
  - NETHER_PORTAL

routes:
  - name: survival-to-nether-hub
    from:
      world: survival
    to:
      world: spawn_nether
      x: 0.5
      y: 64.0
      z: 0.5
      yaw: 0.0
      pitch: 0.0

  - name: world-to-nether-hub
    from:
      world: world
    to:
      world: spawn_nether
      x: 0.5
      y: 64.0
      z: 0.5
      yaw: 0.0
      pitch: 0.0

global-teleporter:
  enabled: false
  redis-url: ""
  channel: misplease-global-teleporter
  server-name: main
