name: autoteleport
permissions:
    # teleport players that were in a temporary world before regeneration to the spawn
    - autoplayerteleport.onfirstjoin.spawn.end
    - autoplayerteleport.onfirstjoin.spawn.nether
    - autoplayerteleport.onfirstjoin.spawn.recursos2
    - autoplayerteleport.onfirstjoin.spawn.recursos_custom

    # teleport players out of "forbidden" worlds
    - autoplayerteleport.onjoin.spawn.empty
    - autoplayerteleport.onjoin.spawn.empty_nether
    - autoplayerteleport.onjoin.spawn.empty_the_end
    - autoplayerteleport.onworldjoin.spawn.empty
    - autoplayerteleport.onworldjoin.spawn.empty_nether
    - autoplayerteleport.onworldjoin.spawn.empty_the_end
