# Desired set only. Versions/builds/commits live in plugins-lock.yml.
# `name` is the stable label (used by update --only). Required when several
# plugins share one repo (EssentialsX*) or when the slug/repo label would differ
# from the lock name.
# jar: exact name/path or /regex/ (YAML has no regex type). Git matches repo-relative path and basename.
# server.version = Paper *line*; builds float on `plugin-lock update`. Also feeds source:git JVM/bytecode hints.
# Upgrade: bump this line, then plugin-lock update.
server:
  source: papermc
  id: paper
  version: "26.3"

plugins:
  - name: ActionHealth
    source: github
    repo: zeshan321/ActionHealth
  - name: AdvancedRegionMarket
    source: github
    repo: alex9849/advanced-region-market
  - name: AutoSellChests
    source: hangar
    project: GPPlugins/AutoSellChests
  - name: Chunky
    source: modrinth
    slug: chunky
  - name: ChunkyBorder
    source: modrinth
    slug: chunkyborder
  - name: DeathCoordinates
    source: spiget
    id: "43318"
  - name: EssentialsX
    source: github
    repo: EssentialsX/Essentials
    # Versioned core jar only (not EssentialsXChat-/Protect-/…).
    jar: /^EssentialsX-[0-9]/
  - name: EssentialsXChat
    source: github
    repo: EssentialsX/Essentials
    jar: /^EssentialsXChat-/
  - name: EssentialsXProtect
    source: github
    repo: EssentialsX/Essentials
    jar: /^EssentialsXProtect-/
  - name: EssentialsXSpawn
    source: github
    repo: EssentialsX/Essentials
    jar: /^EssentialsXSpawn-/
  - name: GSit
    source: github
    repo: gecolay/GSit
  - name: Multiverse-Inventories
    source: modrinth
    slug: multiverse-inventories
  - name: NBTAPI
    source: modrinth
    slug: nbtapi
  - name: Plot2Dynmap
    source: modrinth
    slug: plot2dynmap
  - name: VoxelSniper
    source: modrinth
    slug: fastasyncvoxelsniper
  - name: FastAsyncWorldEdit
    source: modrinth
    slug: fastasyncworldedit
  - name: SuperiorSkyblock2
    source: jenkins
    server: https://hub.bg-software.com
    job: SuperiorSkyblock2 - Stable Builds
    jar: /^SuperiorSkyblock2-[0-9]/
  - name: PlotSquared
    source: git
    repo: https://github.com/IntellectualSites/PlotSquared.git
    jar: /^plotsquared-bukkit-/
    java: "25"
  - name: DecentHolograms
    source: modrinth
    slug: decentholograms
  # Temporary until Modrinth paper/spigot ships past 3.7-beta-8 (and/or with 26.x).
  # - name: Dynmap
  #   source: modrinth
  #   slug: dynmap
  #   channel: beta
  # Fork of webbukkit/dynmap @ v3.0-community-edition, Paper 26.x helpers only.
  - name: Dynmap
    source: github
    repo: misdocumeno/dynmap
    version: v26.3.6-ce
    jar: /^Dynmap-CE-.*-spigot\.jar$/
  - name: LuckPerms
    source: modrinth
    slug: luckperms
  - name: Multiverse-Core
    source: modrinth
    slug: multiverse-core
  - name: PlaceholderAPI
    source: modrinth
    slug: placeholderapi
  - name: ProtectionStones
    source: modrinth
    slug: protectionstones
  # Temporary until Modrinth lists 26.3 (1.5.42 only goes through 26.2).
  # - name: RoseStacker
  #   source: modrinth
  #   slug: rosestacker
  # Fork of Rosewood-Development/RoseStacker, NMS trimmed to v26_3_R1 only.
  - name: RoseStacker
    source: github
    repo: misdocumeno/RoseStacker
    version: v26.3.6
    jar: /^RoseStacker/
