# Desired set only. Versions/builds/commits live in plugins-lock.yml.
# `name` is the stable label (used by update --only). Required when several
# plugins share one repo (EssentialsX*) or when the slug/repo label would differ
# from the lock name.
# jar: exact name/path or /regex/ (YAML has no regex type). Git matches repo-relative path and basename.
minecraft: "26.3"
server:
  source: papermc
  id: paper
  version: "26.3"

plugins:
  - name: ActionHealth
    source: github
    repo: zeshan321/ActionHealth
  - name: AdvancedRegionMarket
    source: github
    repo: alex9849/advanced-region-market
  - name: AutoSellChests
    source: hangar
    project: GPPlugins/AutoSellChests
  - name: Chunky
    source: modrinth
    slug: chunky
  - name: ChunkyBorder
    source: modrinth
    slug: chunkyborder
  - name: CoreProtect
    source: modrinth
    slug: coreprotect
  - name: EssentialsX
    source: github
    repo: EssentialsX/Essentials
    # Versioned core jar only (not EssentialsXChat-/Protect-/…).
    jar: /^EssentialsX-[0-9]/
  - name: EssentialsXChat
    source: github
    repo: EssentialsX/Essentials
    jar: /^EssentialsXChat-/
  - name: EssentialsXProtect
    source: github
    repo: EssentialsX/Essentials
    jar: /^EssentialsXProtect-/
  - name: EssentialsXSpawn
    source: github
    repo: EssentialsX/Essentials
    jar: /^EssentialsXSpawn-/
  - name: GSit
    source: github
    repo: gecolay/GSit
  - name: Multiverse-Inventories
    source: modrinth
    slug: multiverse-inventories
  - name: NBTAPI
    source: modrinth
    slug: nbtapi
  - name: Plot2Dynmap
    source: modrinth
    slug: plot2dynmap
  - name: VoxelSniper
    source: modrinth
    slug: fastasyncvoxelsniper
  - name: FastAsyncWorldEdit
    source: modrinth
    slug: fastasyncworldedit
  - name: SuperiorSkyblock2
    source: jenkins
    server: https://hub.bg-software.com
    job: SuperiorSkyblock2 - Stable Builds
    jar: /^SuperiorSkyblock2-[0-9]/
  - name: PlotSquared
    source: git
    repo: https://github.com/IntellectualSites/PlotSquared.git
    jar: /^plotsquared-bukkit-/
    java: "25"
  - name: DecentHolograms
    source: modrinth
    slug: decentholograms
  - name: Dynmap
    source: modrinth
    slug: dynmap
    channel: beta
  - name: LuckPerms
    source: modrinth
    slug: luckperms
  - name: Multiverse-Core
    source: modrinth
    slug: multiverse-core
  - name: PlaceholderAPI
    source: modrinth
    slug: placeholderapi
  - name: ProtectionStones
    source: modrinth
    slug: protectionstones
  - name: RoseStacker
    source: modrinth
    slug: rosestacker
  - name: SimpleScore
    source: modrinth
    slug: simplescore
  - name: VoidGen
    source: modrinth
    slug: voidgen
  # 7.0.21+ needs WorldEdit YAMLProcessor(Path) that FAWE 2.16.2 does not ship; 7.0.18 supports 26.3.
  - name: WorldGuard
    source: modrinth
    slug: worldguard
    version: "7.0.18"
  - name: Vault
    source: github
    repo: MilkBowl/Vault
  # OpenInv: prod stub (jaxy) has no public source — own rewrite later.
  - name: TabList
    source: github
    repo: montlikadani/TabList
    jar: /^TabList-bukkit-/
  # ImageFrame replaces Spiget Images (maps must be re-created once on deploy).
  - name: ImageFrame
    source: modrinth
    slug: imageframe
  # Paper cannot accept client legacy & codes on sign edit; keep a tiny color plugin.
  - name: ColoredSigns
    source: modrinth
    slug: coloredsigns
  - name: SignManager
    source: modrinth
    slug: signmanager
  - name: AdvancedPlHide
    source: modrinth
    slug: advancedplhide
  - name: ExtraContexts
    source: jenkins
    server: https://ci.lucko.me
    job: ExtraContexts
  - name: spark
    source: jenkins
    server: https://ci.lucko.me
    job: spark
    jar: /^spark-.*-paper\.jar$/
  - name: Jobs
    source: spiget
    id: "4216"
  - name: CMILib
    source: spiget
    id: "87610"
  # CommandRegions → WorldGuardExtraFlags command-on-entry / console-command-on-entry.
  # DeathCoordinates → Essentials backAfterDeath click + essentials.back.ondeath.
  - name: VillagerTradeLimiter
    source: spiget
    id: "87210"
  - name: GravityTubes
    source: spiget
    id: "64624"
  # LightCleaner hard-requires BKCommonLib at enable time.
  - name: BKCommonLib
    source: modrinth
    slug: bkcommonlib
  - name: LightCleaner
    source: spiget
    id: "42469"
  - name: EconomyShopGUI
    source: modrinth
    slug: economyshopgui
  - name: PlayMoreSounds
    source: github
    repo: chrisrnj/PlayMoreSounds
  - name: WorldGuardExtraFlags
    source: github
    repo: aromaa/WorldGuardExtraFlags
  - name: AutoConsoleCommands
    source: github
    repo: misdocumeno/AutoConsoleCommands
  - name: AutoPlayerTeleport
    source: github
    repo: misdocumeno/AutoPlayerTeleport
  - name: BetterBack
    source: github
    repo: misdocumeno/BetterBack
  - name: BetterWarps
    source: github
    repo: misdocumeno/BetterWarps
  - name: BiomePrinter
    source: github
    repo: misdocumeno/BiomePrinter
  - name: ConnectionLogger
    source: github
    repo: misdocumeno/ConnectionLogger
  - name: EternalEffects
    source: github
    repo: misdocumeno/EternalEffects
  - name: GetWorldName
    source: github
    repo: misdocumeno/GetWorldName
  - name: HiddenHolograms
    source: github
    repo: misdocumeno/HiddenHolograms
  - name: NoSlimesInMisPark
    source: github
    repo: misdocumeno/NoSlimesInMisPark
  - name: PermissionShops
    source: github
    repo: misdocumeno/PermissionShops
  - name: PermitShulkers
    source: github
    repo: misdocumeno/PermitShulkers
  - name: PortalRoutes
    source: github
    repo: misdocumeno/PortalRoutes
  - name: TheBestRTP
    source: github
    repo: misdocumeno/TheBestRTP
  - name: TrackPlayTime
    source: github
    repo: misdocumeno/TrackPlayTime
  - name: WorldGameMode
    source: github
    repo: misdocumeno/WorldGameMode
  - name: WorldPrinter
    source: github
    repo: misdocumeno/WorldPrinter
  - name: Slimefun
    source: github
    repo: misdocumeno/Slimefun4
  # Release uploads a thin *-SNAPSHOT.jar and a shaded QuickShop.jar (needs MineDown etc.).
  - name: QuickShop
    source: github
    repo: misdocumeno/QuickShop-Reremake
    jar: /^QuickShop\.jar$/
