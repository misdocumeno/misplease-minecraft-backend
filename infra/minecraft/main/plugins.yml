  # 7.0.21+ needs WorldEdit YAMLProcessor(Path) that FAWE 2.16.2 does not ship; 7.0.18 supports 26.3.
  - name: WorldGuard
    source: modrinth
    slug: worldguard
    version: "7.0.18"
  - name: Vault
    source: github
    repo: MilkBowl/Vault
  # Replaces abandoned montlikadani/TabList (hard version gate on Paper 26.3).
  - name: TAB
    source: modrinth
    slug: tab-was-taken
    version: "6.2.1"
