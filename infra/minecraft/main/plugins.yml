  # Same jar on Velocity + backends; proxy owns /skin + storage (global). See skinsrestorer.net/docs/installation/velocity
  - name: SkinsRestorer
    source: modrinth
    slug: skinsrestorer
  # Via* on backends (not Velocity). VV = older clients; VB = newer clients than this Paper.
  - name: ViaVersion
    source: modrinth
    slug: viaversion
  - name: ViaBackwards
    source: modrinth
    slug: viabackwards
  - name: AdvancedPlHide
    source: modrinth
    slug: advancedplhide
  - name: ExtraContexts
    source: jenkins
    server: https://ci.lucko.me
    job: ExtraContexts
  # Prefer the bukkit plugin jar. spark-*-paper.jar is the module Paper shades in;
  # it has no plugin.yml, so Paper logs a misleading "Directory '….jar' does not contain…".
  - name: spark
    source: jenkins
    server: https://ci.lucko.me
    job: spark
    jar: /^spark-.*-bukkit\.jar$/
