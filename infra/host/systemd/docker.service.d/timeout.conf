[Service]
# The stack cannot stop inside systemd's default 90 s budget.
#
# Measured on 2026-11-22 00:38 UTC (journalctl -b -1):
#   00:38:04  docker.service stop begins
#   00:38:34  velocity (stop_grace_period 30s) never handled SIGTERM -> SIGKILL
#   00:38:10  tech finished its world saves, then waited on Moonrise worker pools
#   00:38:39  main same, "Awaiting termination of worker pool for up to 60s"
#   00:39:34  systemd: "docker.service: State 'stop-sigterm' timed out. Killing."
#             -> dockerd SIGKILLed, both JVMs killed mid-shutdown.
#
# 30 s (proxy) + 90 s (tech) + 90 s (main) + slack does not fit 90 s, so the
# shutdown always ended with SIGKILL. 600 s lets the 90 s per-container grace
# periods actually be used. Shutdown is not slower when containers exit early:
# docker returns as soon as the last container is gone.
TimeoutStopSec=600
