# Container logs on disk, for a week, without them dying with the container.
#
# Why: docker's json-file driver keeps a container's stdout in
# /var/lib/docker/containers/<id>/<id>-json.log, and that directory is deleted
# when the container is recreated. Every deploy recreates containers, so each
# deploy erased the previous logs - including Velocity's, which are never
# written to a file. A player-reported `getsockopt` on 2026-11-21 could not be
# reconstructed for exactly this reason.
#
# With the journald log driver the same lines land in the persistent journal
# (survives container removal), `docker logs` keeps working, and
# `journalctl CONTAINER_NAME=misplease-proxy` can be queried for days.
#
# Rate limit off: Paper logs are chatty and journald's default burst limit
# (1000 lines / 30 s) silently drops container output.
[Journal]
Storage=persistent
RateLimitIntervalSec=0
SystemMaxUse=4G
MaxRetentionSec=1week
