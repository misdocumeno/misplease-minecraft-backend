config-version = "4.0"

bind = "0.0.0.0:25577"
online-mode = false
# Modern forwarding required for correct UUIDs/skins on offline-mode backends.
# Secret lives in forwarding.secret (injected from VELOCITY_FORWARDING_SECRET) — must match Paper proxies.velocity.secret.
player-info-forwarding-mode = "modern"
# Backends are Paper 26.3. Multi-version = ViaVersion+ViaBackwards on main/tech (not on this proxy).
# Keep each line short — the multiplayer list truncates wide lines with "…".
motd = "<blue>-x-x-x-</blue> <dark_purple><bold>MisPlease</bold></dark_purple> <blue>-x-x-x-</blue>\n<blue>Survival</blue> <dark_purple>·</dark_purple> <blue>misplease.com</blue> <dark_purple>·</dark_purple> <blue>1.20+</blue>"
show-max-players = 20

[servers]
main = "main:25565"
tech = "tech:25565"

try = ["main"]

[forced-hosts]
