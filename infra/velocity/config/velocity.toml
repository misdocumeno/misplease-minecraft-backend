config-version = "4.0"

bind = "0.0.0.0:25577"
online-mode = false
# Modern forwarding required for correct UUIDs/skins on offline-mode backends.
# Secret lives in forwarding.secret (injected from VELOCITY_FORWARDING_SECRET) — must match Paper proxies.velocity.secret.
player-info-forwarding-mode = "modern"
# Backends are Paper 26.3. Multi-version = ViaVersion+ViaBackwards on main/tech (not on this proxy).
# Flat MiniMessage (close every tag). Deep nesting from unclosed colors makes the
# Java server list ignore the newline and truncate line 1 with "...".
motd = "<blue>-x-x-x-x-</blue>          <dark_purple><bold>MisPlease</bold></dark_purple>          <blue>-x-x-x-x-</blue><newline><dark_purple><bold>|</bold></dark_purple>  <blue>Survival</blue>  <dark_purple><bold>|</bold></dark_purple>         <blue>misplease.com</blue>         <dark_purple><bold>|</bold></dark_purple>    <blue>1.20+</blue>   <dark_purple><bold>|</bold></dark_purple>"
show-max-players = 20

[servers]
main = "main:25565"
tech = "tech:25565"

try = ["main"]

[forced-hosts]
