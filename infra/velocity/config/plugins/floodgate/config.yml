# Shared with Paper Floodgate via FLOODGATE_KEY_PEM (entrypoint writes key.pem).
key-file-name: key.pem
username-prefix: "."
replace-spaces: true

# Backends also run Floodgate (skins/API) — send encrypted player data.
send-floodgate-data: true

disconnect:
  invalid-key: Please connect through the official Geyser
  invalid-arguments-length: Expected {} arguments, got {}. Is Geyser up-to-date?

# Own-linking sqlite is broken on Velocity 4.3 (Guice 7 skips javax.inject →
# dataDirectory NPE; GeyserMC PR #645 still open). Bedrock→offline UUID is done
# by velocity-auth-adapter GameProfile rewrite instead.
player-link:
  enabled: true
  require-link: false
  enable-own-linking: false
  allowed: true
  link-code-timeout: 300
  type: sqlite
  enable-global-linking: false

metrics:
  enabled: false

config-version: 3
