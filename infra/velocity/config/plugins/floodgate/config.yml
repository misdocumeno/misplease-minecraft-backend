# Shared with Paper Floodgate via FLOODGATE_KEY_PEM (entrypoint writes key.pem).
key-file-name: key.pem
username-prefix: "."
replace-spaces: true

# Backends also run Floodgate (skins/API) — send encrypted player data.
send-floodgate-data: true

disconnect:
  invalid-key: Please connect through the official Geyser
  invalid-arguments-length: Expected {} arguments, got {}. Is Geyser up-to-date?

# Own linking on the proxy only (sqlite jar in plugins/floodgate/).
# Auth-adapter calls linkPlayer with OfflinePlayer UUID from auth — not global/Mojang.
player-link:
  enabled: true
  require-link: false
  enable-own-linking: true
  allowed: true
  link-code-timeout: 300
  type: sqlite
  enable-global-linking: false

metrics:
  enabled: false

config-version: 3
