# Desired set only. Versions live in plugins-lock.yml.
# Adding/removing a plugin: edit this file, re-lock with
#   cd tools/plugin-lock && node --experimental-strip-types src/cli.ts update \
#     --desired ../../infra/velocity/plugins.yml \
#     --lock ../../infra/velocity/plugins-lock.yml --only <Name>
# then commit both files. Never place jars by hand on the VM.
# Full workflow: tools/plugin-lock/README.md
# server.version = Velocity release *line* (Fill API). Omit build → latest build of that line.
server:
  source: papermc
  id: velocity
  version: "4.3.1"

plugins:
  - name: LuckPerms
    source: modrinth
    slug: luckperms
    loaders: [velocity]
    jar: /^LuckPerms-Velocity-/
  # ViaVersion/ViaBackwards live on Paper backends (not here) — SR + cleaner proxy path.
  # Proxy + every backend. Commands/storage on Velocity = network-wide /skin.
  - name: SkinsRestorer
    source: modrinth
    slug: skinsrestorer
    loaders: [velocity]
  # Standard RCON on the proxy (Velocity has none built-in). Bind stays on the
  # compose network only — do not publish the port. Same password as Paper RCON.
  # Velocircon (code-lime): actively maintained, env overrides, ~3k Modrinth dl.
  - name: Velocircon
    source: modrinth
    slug: velocircon
    version: "1.0.7"
    loaders: [velocity]
  # Bedrock crossplay: Geyser on proxy only; Floodgate on proxy (+ Paper for API/skins).
  # Official jars via download.geysermc.org (Floodgate Velocity/Spigot are not on Modrinth).
  - name: Geyser
    source: geysermc
    id: geyser
    asset: velocity
  - name: Floodgate
    source: geysermc
    id: floodgate
    asset: velocity
  # Network-wide kick/ban/mute. Proxy only: backends reach it through plugin messaging.
  # Mutes are enforced by our own chat plugin through the bans-api (compileOnly,
  # never bundled) so the global chat pipeline stays ours. Storage: PostgreSQL.
  - name: LibertyBans
    source: modrinth
    slug: libertybans
    # 1.2.0-M1 is the first release for 26.3; Modrinth still marks it as a beta.
    version: "1.2.0-M1"
    channel: beta
    loaders: [velocity]
  # Temporary fork: Guice 7 / Velocity 4 own-linking (upstream PR #645 still open).
  - name: FloodgateSqliteDatabase
    source: github
    repo: misdocumeno/Floodgate-misplease
    version: v2.2.5-misplease.1
    jar: /^floodgate-sqlite-database\.jar$/
  # Virtual world for the proxy login limbo. velocity-limbo declares it as a hard
  # dependency, so this entry must exist before that plugin can load. Not on
  # Maven: the release jar is also the compile-time API (see the plugin's
  # build.gradle.kts, pinned to the same 1.2.0 + sha256).
  - name: LimboAPI
    source: github
    repo: Elytrium/LimboAPI
    version: "1.2.0"
    jar: /^limboapi-1\.2\.0\.jar$/
