# Desired set only. Versions live in plugins-lock.yml.
# server.version = Velocity release *line* (Fill API). Omit build → latest build of that line.
server:
  source: papermc
  id: velocity
  version: "4.3.1"

plugins:
  - name: LuckPerms
    source: modrinth
    slug: luckperms
    loaders: [velocity]
    jar: /^LuckPerms-Velocity-/
  # ViaVersion/ViaBackwards live on Paper backends (not here) — SR + cleaner proxy path.
  # Proxy + every backend. Commands/storage on Velocity = network-wide /skin.
  - name: SkinsRestorer
    source: modrinth
    slug: skinsrestorer
    loaders: [velocity]
