# Desired set only. Versions live in plugins-lock.yml.
# server.version = Velocity release *line* (Fill API). Omit build → latest build of that line.
server:
  source: papermc
  id: velocity
  version: "4.3.1"

plugins:
  - name: LuckPerms
    source: modrinth
    slug: luckperms
    loaders: [velocity]
    jar: /^LuckPerms-Velocity-/
  # ViaVersion/ViaBackwards live on Paper backends (not here) — SR + cleaner proxy path.
  # Proxy + every backend. Commands/storage on Velocity = network-wide /skin.
  - name: SkinsRestorer
    source: modrinth
    slug: skinsrestorer
    loaders: [velocity]
  # Standard RCON on the proxy (Velocity has none built-in). Bind stays on the
  # compose network only — do not publish the port. Same password as Paper RCON.
  # Velocircon (code-lime): actively maintained, env overrides, ~3k Modrinth dl.
  - name: Velocircon
    source: modrinth
    slug: velocircon
    version: "1.0.7"
    loaders: [velocity]
  # Bedrock crossplay: Geyser on proxy only; Floodgate on proxy (+ Paper for API/skins).
  # Official jars via download.geysermc.org (Floodgate Velocity/Spigot are not on Modrinth).
  - name: Geyser
    source: geysermc
    id: geyser
    asset: velocity
  - name: Floodgate
    source: geysermc
    id: floodgate
    asset: velocity
